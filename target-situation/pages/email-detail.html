<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮件详情</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; }
  body {
    font-family:'Segoe UI','Microsoft YaHei',sans-serif;
    background:linear-gradient(180deg,#070d18 0%,#0a1628 100%);
    color:#c9d1d9; overflow:auto;
  }
  .ed-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; border-bottom:1px solid rgba(56,189,248,0.15);
    background:rgba(10,22,40,0.8); backdrop-filter:blur(8px);
  }
  .ed-title {
    display:flex; align-items:center; gap:10px;
    font-size:15px; font-weight:700; color:#fff;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%;
  }
  .ed-title svg { flex-shrink:0; color:#38bdf8; }
  .ed-meta {
    font-size:12px; color:#7a8599;
    font-family:'JetBrains Mono','Consolas',monospace;
  }
  .ed-main {
    max-width:900px; margin:0 auto; padding:24px;
  }
  .ed-card {
    background:rgba(13,31,58,0.7); border:1px solid rgba(56,189,248,0.15);
    border-radius:10px; overflow:hidden; margin-bottom:16px;
  }
  .ed-card-header {
    padding:14px 20px; border-bottom:1px solid rgba(56,189,248,0.12);
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(56,189,248,0.04);
  }
  .ed-card-title {
    font-size:13px; font-weight:700; color:#38bdf8;
    display:flex; align-items:center; gap:8px;
  }
  .ed-card-title svg { flex-shrink:0; }
  .ed-header-row {
    display:flex; padding:10px 20px; font-size:13px;
    border-bottom:1px solid rgba(56,189,248,0.08);
  }
  .ed-header-row:last-child { border-bottom:none; }
  .ed-header-key {
    width:80px; color:#7a8599; font-size:12px; flex-shrink:0;
  }
  .ed-header-val {
    flex:1; color:#c9d1d9; word-break:break-all;
    font-family:'JetBrains Mono','Consolas',monospace; font-size:12px;
  }
  .ed-header-val.subject {
    font-size:14px; font-weight:600; color:#fff;
    font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  }
  .ed-body {
    padding:20px; font-size:13px; line-height:1.8; color:#c9d1d9;
    white-space:pre-wrap; word-break:break-word;
    font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  }
  .ed-attach-list { padding:8px 0; }
  .ed-attach-item {
    display:flex; align-items:center; gap:12px;
    padding:12px 20px; border-bottom:1px solid rgba(56,189,248,0.08);
    transition:background .15s;
  }
  .ed-attach-item:hover { background:rgba(56,189,248,0.05); }
  .ed-attach-item:last-child { border-bottom:none; }
  .ed-attach-icon {
    width:36px; height:36px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:#fff; text-transform:uppercase;
    font-family:'JetBrains Mono','Consolas',monospace;
  }
  .ed-attach-icon.pdf { background:#ef4444; }
  .ed-attach-icon.doc { background:#3b82f6; }
  .ed-attach-icon.xls { background:#22c55e; }
  .ed-attach-icon.ppt { background:#f97316; }
  .ed-attach-icon.kml { background:#8b5cf6; }
  .ed-attach-icon.zip { background:#6b7280; }
  .ed-attach-icon.pcap { background:#ec4899; }
  .ed-attach-icon.csv { background:#22c55e; }
  .ed-attach-icon.image { background:#06b6d4; }
  .ed-attach-icon.text { background:#64748b; }
  .ed-attach-icon.conf { background:#a855f7; }
  .ed-attach-icon.archive { background:#d97706; }
  .ed-attach-info { flex:1; min-width:0; }
  .ed-attach-name {
    font-size:13px; color:#e2e8f0; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ed-attach-meta {
    font-size:11px; color:#7a8599; margin-top:2px;
    font-family:'JetBrains Mono','Consolas',monospace;
  }
  .ed-attach-download {
    padding:6px 12px; border-radius:5px; border:1px solid rgba(56,189,248,0.3);
    background:rgba(56,189,248,0.1); color:#38bdf8; font-size:12px;
    cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:5px;
    text-decoration:none; flex-shrink:0;
  }
  .ed-attach-download:hover {
    background:rgba(56,189,248,0.2); border-color:#38bdf8;
  }
  .ed-attach-download svg { width:14px; height:14px; }
  .ed-risk-tag {
    display:inline-block; padding:2px 8px; border-radius:3px;
    font-size:11px; font-weight:600; margin-left:8px;
  }
  .ed-risk-tag.high { background:rgba(239,68,68,0.2); color:#f87171; }
  .ed-risk-tag.medium { background:rgba(245,158,11,0.2); color:#fbbf24; }
  .ed-divider {
    height:1px; background:rgba(56,189,248,0.1); margin:12px 0;
  }
  .ed-empty {
    padding:40px 20px; text-align:center; color:#7a8599; font-size:13px;
  }
  .ed-loading {
    padding:60px 20px; text-align:center; color:#7a8599; font-size:13px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
  var urlParams = new URLSearchParams(window.location.search);
  var payload = urlParams.get('data');
  var emailData = null;

  if (payload) {
    try {
      emailData = JSON.parse(decodeURIComponent(payload));
    } catch(e) {
      console.error('Failed to parse email data:', e);
    }
  }

  function getExtClass(ext) {
    var map = {
      pdf:'pdf', doc:'doc', docx:'doc', xls:'xls', xlsx:'xls',
      ppt:'ppt', pptx:'ppt', kml:'kml', zip:'zip', pcap:'pcap',
      csv:'csv', png:'image', jpg:'image', jpeg:'image', gif:'image',
      txt:'text', conf:'conf', 'tar.gz':'archive', rar:'archive'
    };
    return map[ext] || 'text';
  }

  function getFileIcon(name, ext) {
    if (ext === 'tar.gz') return 'TGZ';
    if (ext === 'docx') return 'DOCX';
    if (ext === 'xlsx') return 'XLSX';
    if (ext === 'pptx') return 'PPTX';
    return (ext || name.split('.').pop() || 'FILE').toUpperCase().substring(0,4);
  }

  function downloadAttachment(emailId, attachName) {
    // 模拟下载：生成一个 Blob 文件触发浏览器下载
    var content = '这是文件「' + attachName + '」的模拟内容。\n\n';
    content += '所属邮件: ' + emailId + '\n';
    content += '下载时间: ' + new Date().toLocaleString('zh-CN') + '\n';
    content += '文件内容为演示数据。\n';
    
    var blob = new Blob([content], { type: 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = attachName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
  }

  function renderPage() {
    var app = document.getElementById('app');
    
    if (!emailData) {
      app.innerHTML = '<div class="ed-loading">邮件数据加载失败，请从邮件列表点击打开...</div>';
      return;
    }

    var e = emailData;
    var riskyTag = '';
    if (e.risky) riskyTag = '<span class="ed-risk-tag high">敏感邮件</span>';
    else if (e.yellow) riskyTag = '<span class="ed-risk-tag medium">待核实</span>';

    // Header
    var html = '<div class="ed-header">';
    html += '<div class="ed-title">';
    html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>';
    html += '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (e.subject || '（无主题）') + '</span>';
    html += riskyTag;
    html += '</div>';
    html += '<div class="ed-meta">' + (e.id || 'MAIL') + ' · ' + (e.time || '') + '</div>';
    html += '</div>';

    html += '<div class="ed-main">';

    // 邮件信息卡片
    html += '<div class="ed-card">';
    html += '<div class="ed-card-header">';
    html += '<div class="ed-card-title">';
    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    html += '邮件信息';
    html += '</div>';
    html += '</div>';
    html += '<div class="ed-header-row"><div class="ed-header-key">主题</div><div class="ed-header-val subject">' + (e.subject || '-') + '</div></div>';
    html += '<div class="ed-header-row"><div class="ed-header-key">发件人</div><div class="ed-header-val">' + (e.from || '-') + '</div></div>';
    html += '<div class="ed-header-row"><div class="ed-header-key">收件人</div><div class="ed-header-val">' + (e.to || '-') + '</div></div>';
    html += '<div class="ed-header-row"><div class="ed-header-key">时间</div><div class="ed-header-val">' + (e.time || '-') + '</div></div>';
    html += '<div class="ed-header-row"><div class="ed-header-key">邮件ID</div><div class="ed-header-val">' + (e.id || '-') + '</div></div>';
    html += '</div>';

    // 邮件正文
    html += '<div class="ed-card">';
    html += '<div class="ed-card-header">';
    html += '<div class="ed-card-title">';
    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
    html += '邮件正文';
    html += '</div>';
    html += '</div>';
    html += '<div class="ed-body">' + (e.body || '（无正文内容）') + '</div>';
    html += '</div>';

    // 附件列表
    var attachments = e.attachments || [];
    html += '<div class="ed-card">';
    html += '<div class="ed-card-header">';
    html += '<div class="ed-card-title">';
    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
    html += '附件列表';
    html += '<span style="margin-left:8px;font-size:11px;color:#7a8599;font-weight:400;">共 ' + attachments.length + ' 个文件</span>';
    html += '</div>';
    html += '</div>';
    if (attachments.length === 0) {
      html += '<div class="ed-empty">本邮件无附件</div>';
    } else {
      html += '<div class="ed-attach-list">';
      attachments.forEach(function(att) {
        var ext = (att.ext || att.name.split('.').pop() || '').toLowerCase();
        var iconClass = getExtClass(ext);
        var iconLabel = getFileIcon(att.name, ext);
        html += '<div class="ed-attach-item">';
        html += '<div class="ed-attach-icon ' + iconClass + '">' + iconLabel + '</div>';
        html += '<div class="ed-attach-info">';
        html += '<div class="ed-attach-name">' + att.name + '</div>';
        html += '<div class="ed-attach-meta">';
        if (att.size) html += att.size + ' · ';
        html += ext.toUpperCase() + ' 文件';
        html += '</div>';
        html += '</div>';
        html += '<button class="ed-attach-download" data-name="' + encodeURIComponent(att.name) + '">';
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
        html += '下载';
        html += '</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '</div>'; // ed-main end

    app.innerHTML = html;

    // 绑定下载事件
    app.querySelectorAll('.ed-attach-download').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var name = decodeURIComponent(btn.getAttribute('data-name'));
        downloadAttachment(e.id || 'MAIL', name);
      });
    });
  }

  renderPage();
</script>
</body>
</html>
