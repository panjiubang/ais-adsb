<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标详情 - 目标监视</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script>
  window._AMapSecurityConfig = { securityJsCode: '' };
  window.AMAP_CONFIG = {
    key: '01d6322cc08dafd1800e07b018b06b49',
    version: '2.0',
    plugins: []
  };
  window.loadAMap = function () {
    return new Promise(function (resolve, reject) {
      if (window.AMap) return resolve(window.AMap);
      var cfg = window.AMAP_CONFIG || {};
      if (!cfg.key || cfg.key.indexOf('YOUR_') === 0) {
        var err = new Error('AMap key 未配置');
        err.code = 'AMAP_NO_KEY';
        return reject(err);
      }
      var src = 'https://webapi.amap.com/maps?v=' + (cfg.version || '2.0') + '&key=' + cfg.key;
      if (cfg.plugins && cfg.plugins.length) src += '&plugin=' + cfg.plugins.join(',');
      var s = document.createElement('script');
      s.type = 'text/javascript'; s.async = true; s.src = src;
      s.onload = function () { resolve(window.AMap); };
      s.onerror = function (e) { reject(e); };
      document.head.appendChild(s);
    });
  };
</script>
<style>
  :root {
    --ts-bg: #0B1220; --ts-bg-2: #070b14;
    --ts-surface: rgba(15,23,42,0.92);
    --ts-surface-2: rgba(21,30,48,0.96);
    --ts-border: rgba(148,163,184,0.18);
    --ts-border-2: rgba(148,163,184,0.30);
    --ts-ink: #e2e8f0; --ts-ink-2: #94a3b8; --ts-ink-3: #64748b;
    --ts-primary: #38bdf8; --ts-primary-dim: rgba(56,189,248,0.14);
    --ts-ship: #4ade80; --ts-aircraft: #f87171; --ts-satellite: #c084fc; --ts-port: #94a3b8;
    --ts-warn: #fb923c; --ts-radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh; height: 100%;
    font-family: "'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif";
    color: var(--ts-ink);
    background:
      radial-gradient(1200px 700px at 10% -10%, rgba(56,189,248,0.08), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(192,132,252,0.07), transparent 60%),
      linear-gradient(180deg, var(--ts-bg) 0%, var(--ts-bg-2) 100%);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* SHIP FULL LAYOUT */
  body.ship-layout { overflow: hidden; }
  .ship-app {
    display: flex; flex-direction: column; height: 100vh; width: 100%; min-height: 0;
  }
  .ship-topbar {
    height: 40px; display: flex; align-items: stretch; justify-content: space-between;
    background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(11,18,32,0.98));
    border-bottom: 1px solid var(--ts-border);
    padding: 0 6px 0 14px; flex-shrink: 0; gap: 10px;
  }
  .ship-topbar-left { display: flex; align-items: stretch; gap: 2px; min-width: 0; }
  .ship-tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 14px; height: 100%;
    font-size: 13px; color: var(--ts-ink-2);
    cursor: pointer; position: relative;
    border: 1px solid transparent; border-top: none; border-bottom: none;
    white-space: nowrap; max-width: 260px;
  }
  .ship-tab:hover { color: var(--ts-ink); background: rgba(255,255,255,0.02); }
  .ship-tab-flag { font-size: 14px; }
  .ship-tab-close {
    width: 16px; height: 16px; border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; color: var(--ts-ink-3);
    opacity: 0; transition: opacity .1s;
  }
  .ship-tab:hover .ship-tab-close { opacity: 1; }
  .ship-tab .ship-tab-close:hover { background: rgba(239,68,68,0.18); color: #fca5a5; }
  .ship-tab.ship-tab-active {
    color: var(--ts-ink); background: rgba(56,189,248,0.06);
  }
  .ship-tab.ship-tab-active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--ts-primary); box-shadow: 0 0 8px rgba(56,189,248,0.5);
  }
  .ship-topbar-right { display: flex; align-items: center; gap: 10px; padding-right: 8px; }
  .topbar-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--ts-border);
    background: rgba(255,255,255,0.02); color: var(--ts-ink-2);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .topbar-btn:hover { color: var(--ts-ink); border-color: var(--ts-border-2); }
  .topbar-btn.vip {
    background: linear-gradient(135deg, rgba(251,146,60,0.25), rgba(239,68,68,0.22));
    color: #fed7aa; border-color: rgba(251,146,60,0.35);
  }
  .topbar-btn.vip:hover { filter: brightness(1.1); }
  .topbar-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, var(--ts-primary), var(--ts-satellite));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; color: #0B1220; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .ship-scroll {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 16px 20px 20px;
  }
  .ship-scroll::-webkit-scrollbar { width: 6px; }
  .ship-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.22); border-radius: 3px; }
  .ship-info {
    background: var(--ts-surface);
    border: 1px solid var(--ts-border);
    border-radius: 12px; overflow: hidden; margin-bottom: 14px;
    display: flex; flex-direction: row; gap: 0;
    backdrop-filter: blur(10px);
  }
  .ship-info-left {
    display: flex; flex-direction: row; gap: 16px;
    padding: 16px; flex-shrink: 0;
  }
  .ship-photo {
    width: 160px; height: 110px; border-radius: 8px; overflow: hidden;
    background: var(--ts-surface-2);
    border: 1px solid var(--ts-border-2);
    position: relative; flex-shrink: 0;
  }
  .ship-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ship-photo-flag {
    position: absolute; left: 8px; bottom: 8px; font-size: 18px;
    background: rgba(0,0,0,0.45); padding: 2px 6px; border-radius: 4px;
    backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
  }
  .ship-meta {
    display: flex; flex-direction: column; justify-content: space-between; min-width: 220px;
  }
  .ship-name-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ship-flag-lg {
    font-size: 22px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--ts-border);
    border-radius: 6px; padding: 2px 6px;
  }
  .ship-name { font-size: 18px; font-weight: 700; color: var(--ts-ink); letter-spacing: 0.3px; }
  .ship-name-sub { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .ship-name-sub .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 5px;
    font-size: 11px; color: var(--ts-ink-2);
    background: rgba(148,163,184,0.08);
    border: 1px solid var(--ts-border);
  }
  .ship-name-sub .tag:hover { color: var(--ts-ink); }
  .ship-name-sub .tag.prime {
    background: rgba(74,222,128,0.12);
    color: var(--ts-ship); border-color: rgba(74,222,128,0.28);
  }
  .ship-fav-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--ts-ink-2); }
  .ship-fav-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--ts-border);
    background: rgba(255,255,255,0.02); cursor: pointer; color: var(--ts-ink-2);
  }
  .ship-fav-btn:hover { color: var(--ts-warn); border-color: var(--ts-border-2); }
  .ship-fav-btn.on { color: var(--ts-warn); border-color: rgba(251,146,60,0.3); }
  .ship-info-right {
    flex: 1; display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: minmax(52px, auto);
    gap: 1px; background: var(--ts-border);
    border-left: 1px solid var(--ts-border);
    min-width: 0;
  }
  .ship-info-cell {
    background: var(--ts-surface);
    padding: 10px 16px;
    display: flex; flex-direction: column; justify-content: center; min-width: 0;
  }
  .ship-info-k {
    font-size: 11px; color: var(--ts-ink-3);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 5px;
  }
  .ship-info-v {
    font-size: 13px; color: var(--ts-ink);
    font-family: "'JetBrains Mono','Consolas',monospace";
    word-break: break-all;
  }
  .ship-info-v.ship-info-v-soft { font-family: inherit; color: var(--ts-ink-2); }
  .ship-info-v.good { color: var(--ts-ship); }
  .ship-info-v.neut { color: var(--ts-ink-2); }
  .ship-info-v.warn { color: var(--ts-warn); }

  /* ====== Ship Crew List ====== */
  .ship-crew {
    background: var(--ts-surface);
    border: 1px solid var(--ts-border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .ship-crew-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--ts-border);
    background: rgba(56,189,248,0.03);
  }
  .ship-crew-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ts-ink);
  }
  .ship-crew-title svg { color: var(--ts-primary); }
  .ship-crew-count {
    font-size: 11px;
    color: var(--ts-ink-3);
    padding: 2px 8px;
    background: rgba(56,189,248,0.08);
    border-radius: 10px;
    border: 1px solid var(--ts-border);
  }
  .ship-crew-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--ts-border);
  }
  .ship-crew-item {
    background: var(--ts-surface);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background .15s;
    cursor: pointer;
  }
  .ship-crew-item:hover {
    background: rgba(56,189,248,0.06);
  }
  .ship-crew-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #0B1220;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .ship-crew-info {
    flex: 1;
    min-width: 0;
  }
  .ship-crew-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ts-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ship-crew-role {
    font-size: 11px;
    color: var(--ts-ink-3);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ship-crew-flag {
    font-size: 16px;
    flex-shrink: 0;
  }
  @media (max-width: 1200px) {
    .ship-crew-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 800px) {
    .ship-crew-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ====== Crew Detail Modal ====== */
  .crew-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(8,14,24,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    animation: crewFadeIn .18s ease-out;
  }
  .crew-modal-box {
    width: 480px; max-width: calc(100vw - 40px); max-height: calc(100vh - 60px);
    background: linear-gradient(180deg, #1e2d42 0%, #182233 100%);
    border: 1px solid rgba(56,189,248,0.25);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    overflow: hidden; display: flex; flex-direction: column;
    animation: crewSlideUp .22s ease-out;
  }
  .crew-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(56,189,248,0.04);
  }
  .crew-modal-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; color: #e2e8f0;
  }
  .crew-modal-title svg { color: #38bdf8; }
  .crew-modal-close {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; color: #94a3b8; font-size: 20px; line-height: 1; cursor: pointer;
    transition: all .15s;
  }
  .crew-modal-close:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
  .crew-modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .crew-modal-hero {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    background: rgba(56,189,248,0.06);
    border: 1px solid rgba(56,189,248,0.15);
    border-radius: 10px; margin-bottom: 16px;
  }
  .crew-modal-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #0B1220;
    border: 2px solid rgba(255,255,255,0.15); flex-shrink: 0;
  }
  .crew-modal-name-block { flex: 1; min-width: 0; }
  .crew-modal-cn-name {
    font-size: 16px; font-weight: 700; color: #e2e8f0;
    display: flex; align-items: center; gap: 8px;
  }
  .crew-modal-en-name {
    font-size: 12px; color: #94a3b8; margin-top: 3px;
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  .crew-modal-flag { font-size: 20px; }
  .crew-modal-fields {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 1px; background: rgba(255,255,255,0.06);
    border-radius: 8px; overflow: hidden;
  }
  .crew-modal-field {
    background: #1a2536;
    padding: 10px 14px;
    display: flex; flex-direction: column; gap: 3px; min-width: 0;
  }
  .crew-modal-field:nth-child(odd) { background: #1c2840; }
  .crew-modal-k {
    font-size: 11px; color: #64748b;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .crew-modal-v {
    font-size: 13px; color: #e2e8f0;
    font-family: 'JetBrains Mono', Consolas, monospace;
    word-break: break-all;
  }
  .crew-modal-v.email { font-family: inherit; color: #38bdf8; }
  .crew-modal-v.tel { color: #22c55e; }
  .crew-modal-v.id { color: #f59e0b; font-size: 12px; letter-spacing: 0.5px; }

  /* ====== Crew Import Modal ====== */
  .crew-import-area {
    width: 100%;
    min-height: 180px;
    background: #141c2b;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 12px;
    font-family: 'JetBrains Mono', Consolas, monospace;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
    line-height: 1.6;
  }
  .crew-import-area:focus { border-color: #38bdf8; }
  .crew-import-area::placeholder { color: #475569; }
  .crew-import-tip {
    margin-top: 8px;
    font-size: 11px;
    color: #64748b;
    line-height: 1.6;
    padding: 8px 12px;
    background: rgba(56,189,248,0.05);
    border-radius: 6px;
    border-left: 2px solid #38bdf8;
  }
  .crew-import-tip b { color: #38bdf8; }
  .crew-import-preview {
    margin-top: 12px;
    max-height: 160px;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    background: rgba(0,0,0,0.2);
  }
  .crew-import-preview-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 12px;
  }
  .crew-import-preview-item:last-child { border-bottom: none; }
  .crew-import-preview-item .ci-pf { color: #22c55e; font-size: 10px; font-weight: 600; }
  .crew-import-preview-item .ci-pe { color: #ef4444; font-size: 10px; font-weight: 600; }
  .crew-import-preview-item .ci-pidx { width: 22px; color: #64748b; font-family: monospace; }
  .crew-import-preview-item .ci-pname { flex: 1; color: #e2e8f0; }
  .crew-import-preview-item .ci-prole { color: #94a3b8; font-size: 11px; }
  .crew-import-preview-summary {
    display: flex; gap: 16px; padding: 8px 12px;
    background: rgba(56,189,248,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
  }
  .crew-import-preview-summary span { color: #38bdf8; font-weight: 600; }

  @keyframes crewFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes crewSlideUp { from { transform: translateY(16px) scale(0.98); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

  .ship-timebar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    background: var(--ts-surface);
    border: 1px solid var(--ts-border);
    border-radius: 10px; padding: 10px 14px;
  }
  .ship-timebar-left {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--ts-ink-2);
  }
  .ship-timebar-left .dash { color: var(--ts-ink-3); padding: 0 2px; }
  .ship-timebar-left b {
    color: var(--ts-ink);
    font-family: "'JetBrains Mono','Consolas',monospace";
    font-weight: 500; letter-spacing: 0.3px;
  }
  .ship-timebar-right { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ship-time-quick {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 3px 8px; border-radius: 5px;
    font-size: 11px; color: var(--ts-ink-2);
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--ts-border);
    cursor: pointer;
  }
  .ship-time-quick:hover { color: var(--ts-ink); border-color: var(--ts-border-2); }
  .ship-time-quick.on { color: var(--ts-primary); border-color: rgba(56,189,248,0.35); background: var(--ts-primary-dim); }

  .ship-track {
    background: var(--ts-surface);
    border: 1px solid var(--ts-border);
    border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 0;
    height: calc(100vh - 40px - 32px - 158px - 14px - 50px - 14px);
  }
  .ship-track-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--ts-border);
    background: rgba(255,255,255,0.02);
    flex-shrink: 0;
  }
  .ship-track-title {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--ts-ink);
  }
  .ship-track-tools { display: inline-flex; align-items: center; gap: 4px; }
  .track-tool-btn {
    width: 28px; height: 28px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--ts-ink-2);
    border: 1px solid transparent; cursor: pointer;
    transition: all .15s;
  }
  .track-tool-btn:hover { background: rgba(255,255,255,0.04); color: var(--ts-ink); border-color: var(--ts-border); }
  .track-tool-btn.active { color: var(--ts-primary); background: var(--ts-primary-dim); border-color: rgba(56,189,248,0.28); }
  .ship-map-wrap {
    flex: 1; min-height: 0; position: relative; background: #0a1426;
  }
  #shipMap { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  /* 2026-08-17: 移除居中大尺寸播放遮罩，避免遮挡历史轨迹线。播放/暂停改由底部 player 的 btn-play 统一控制 */
  .ship-map-overlay-play { display: none !important; }
  @keyframes tsShipPulse {
    0% { transform: scale(0.5); opacity: 0.9; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .ship-player {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: linear-gradient(180deg, rgba(11,18,32,0.9), rgba(7,11,20,0.95));
    border-top: 1px solid var(--ts-border);
    height: 58px; flex-shrink: 0;
  }
  .player-left, .player-right {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--ts-ink-2);
    font-family: "'JetBrains Mono','Consolas',monospace";
    font-size: 12px; letter-spacing: 0.4px;
  }
  .player-btn {
    width: 32px; height: 32px; border-radius: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--ts-border);
    color: var(--ts-ink);

<body>
<div id="app-root"></div>

<script>
  // ========= Helpers =========
  function rnd(min, max) { return Math.random() * (max - min) + min; }
  function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function genId(prefix, n) {
    var s = ''; var hex = '0123456789ABCDEF';
    for (var i = 0; i < 4; i++) s += hex[Math.floor(Math.random() * 16)];
    return prefix + '-' + s + (n < 10 ? '0' + n : n);
  }
  function genTrack(centerLng, centerLat, steps, jitter) {
    var pts = []; var lng = centerLng, lat = centerLat;
    var dLng = rnd(-0.05, 0.05), dLat = rnd(-0.05, 0.05);
    for (var i = 0; i < steps; i++) {
      pts.push([lng, lat]);
      lng += dLng + rnd(-jitter, jitter);
      lat += dLat + rnd(-jitter, jitter);
      dLng *= 0.96; dLat *= 0.96;
    }
    return pts;
  }

  // ============ 船舶海域约束 & 轨迹陆地规避（v2 - 基于海岸线点位） ============
  // 每个海域：深海中心点 + 沿岸港口点列表。船舶点若距任一港口太近（< COAST_MIN_OFFSET），
  // 则沿"港口→海心"方向推到海里。确保100%在海上，不依赖易出错的多边形。
  var CHINA_COASTAL_SEAS = [
    { name: '东海', center: [123.0, 30.5],
      ports: [[121.5,31.2],[121.3,30.3],[121.6,29.9],[121.4,28.7],[120.7,28.0],[119.5,26.6],[119.3,26.0]] },
    { name: '南海', center: [114.5, 20.5],
      ports: [[116.7,23.4],[115.3,22.8],[114.1,22.9],[113.3,23.1],[110.3,21.2],[109.1,21.5],[108.5,21.5]] },
    { name: '黄海', center: [123.5, 35.5],
      ports: [[120.4,36.1],[121.8,37.5],[121.6,38.9],[122.1,37.6],[122.2,36.9],[121.0,35.7],[120.3,35.2]] },
    { name: '台湾海峡', center: [119.3, 24.8],
      ports: [[119.3,26.0],[118.6,25.3],[118.6,24.9],[118.1,24.5],[117.6,23.9],[117.0,23.4]] },
    { name: '北部湾', center: [108.8, 19.5],
      ports: [[109.1,21.5],[109.7,21.4],[109.7,21.0],[108.5,21.5],[108.1,21.4],[108.0,20.9]] }
  ];
  // 距海岸（任一港口）最少偏移度数，低于此值视为"可能在陆地"需向海心推
  var COAST_MIN_OFFSET = 0.20;

  // 找离该点最近的海域中心
  function findNearestSeaCenter(lng, lat) {
    var best = null, bestD = Infinity;
    for (var i = 0; i < CHINA_COASTAL_SEAS.length; i++) {
      var s = CHINA_COASTAL_SEAS[i];
      var dx = (lng - s.center[0]) * Math.cos(s.center[1] * Math.PI / 180);
      var dy = lat - s.center[1];
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  }

  // 找离该点最近的沿岸港口
  function findNearestPort(sea, lng, lat) {
    if (!sea || !sea.ports) return { port: null, dist: Infinity };
    var best = null, bestD = Infinity;
    for (var i = 0; i < sea.ports.length; i++) {
      var p = sea.ports[i];
      var dx = (lng - p[0]) * Math.cos(lat * Math.PI / 180);
      var dy = lat - p[1];
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = p; }
    }
    return { port: best, dist: bestD };
  }

  // 船舶专用轨迹生成：每一步都确保点在海域里；若漂移到陆地则按方向向最近海域回拉
  function genShipTrack(startLng, startLat, steps, jitter) {
    var start = _snapShipPointToSea(startLng, startLat);
    var lng = start[0], lat = start[1];
    var pts = [];
    var dLng = rnd(-0.03, 0.03), dLat = rnd(-0.03, 0.03);
    for (var i = 0; i < steps; i++) {
      pts.push([lng, lat]);
      var nLng = lng + dLng + rnd(-jitter, jitter);
      var nLat = lat + dLat + rnd(-jitter, jitter);
      dLng *= 0.96; dLat *= 0.96;
      var fixed = _snapShipPointToSea(nLng, nLat);
      if (Math.abs(fixed[0] - nLng) + Math.abs(fixed[1] - nLat) > 0.15) {
        dLng = (fixed[0] - lng) * 0.4;
        dLat = (fixed[1] - lat) * 0.4;
      }
      lng = fixed[0]; lat = fixed[1];
    }
    return pts;
  }

  // 将点吸附到"最可能的海域"：用"距岸最近港口 → 海心方向"推到海里
  function _snapShipPointToSea(lng, lat) {
    var sea = findNearestSeaCenter(lng, lat);
    if (!sea) return [lng, lat];
    var nearest = findNearestPort(sea, lng, lat);
    if (nearest.dist < COAST_MIN_OFFSET && nearest.port) {
      var dirLng = sea.center[0] - nearest.port[0];
      var dirLat = sea.center[1] - nearest.port[1];
      var len = Math.sqrt(dirLng * dirLng + dirLat * dirLat) || 1;
      dirLng /= len; dirLat /= len;
      var pushDist = COAST_MIN_OFFSET + (COAST_MIN_OFFSET - nearest.dist);
      lng = nearest.port[0] + dirLng * pushDist;
      lat = nearest.port[1] + dirLat * pushDist;
    }
    // 距海心过大（>4°）时拉回，避免漂到不该去的地方
    var dx2 = (lng - sea.center[0]) * Math.cos(sea.center[1] * Math.PI / 180);
    var dy2 = lat - sea.center[1];
    var dc = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    if (dc > 4.0) {
      var factor = 3.5 / dc;
      lng = sea.center[0] + (lng - sea.center[0]) * factor;
      lat = sea.center[1] + (lat - sea.center[1]) * factor;
    }
    return [parseFloat(lng.toFixed(4)), parseFloat(lat.toFixed(4))];
  }

    var div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str == null ? '' : str)));

      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"') {
          if (inQuote && line[i + 1] === '"') { cur += '"'; i++; }
          else { inQuote = !inQuote; }
        } else if (c === ',' && !inQuote) {

      }

  // ========= Track sampling + playback =========
  function resampleTrack(points, samples) {
    if (!points || points.length === 0) return [];
    if (points.length === 1) {
      var arr = [];
      for (var i = 0; i < samples; i++) arr.push([points[0][0], points[0][1]]);
      return arr;
    }
    var segLens = []; var total = 0;
    for (var i = 1; i < points.length; i++) {
      var dx = points[i][0] - points[i-1][0];
      var dy = points[i][1] - points[i-1][1];
      var d = Math.sqrt(dx*dx + dy*dy);
      segLens.push(d); total += d;
    }
    if (total === 0) {
      var arr2 = [];
      for (var j = 0; j < samples; j++) arr2.push([points[0][0], points[0][1]]);
      return arr2;
    }
    var cum = [0];
    for (var k = 0; k < segLens.length; k++) cum.push(cum[k] + segLens[k]);
    var out = [];
    for (var s = 0; s < samples; s++) {
      var target = (s / (samples - 1)) * total;
      var seg = 0;
      while (seg < segLens.length && cum[seg+1] < target) seg++;
      if (seg >= segLens.length) {
        out.push([points[points.length-1][0], points[points.length-1][1]]);
        continue;
      }
      var localT = (target - cum[seg]) / (segLens[seg] || 1);
      var x = points[seg][0] + (points[seg+1][0] - points[seg][0]) * localT;
      var y = points[seg][1] + (points[seg+1][1] - points[seg][1]) * localT;
      out.push([x, y]);
    }
    return out;
  }

  function regeneratePlayTrackForDays(item, days) {
    var base = (item.track && item.track.length) ? item.track.slice() : [item.pos || [121.5, 31.0]];
    var steps = Math.round(base.length * (days / 7)) + 8;
    steps = Math.min(120, Math.max(20, steps));
    var jitter = 0.015 + Math.min(0.12, days * 0.002);
    var center = base[Math.floor(base.length / 2)];
    var isShip = (getQueryParam('type') === 'ship') || !!(item && (item.shipType || item.mmsi || item.imo ||
      (item.type && /船|舰|艇|货|油|散|客|渔|勘|军/i.test(item.type))));
    var newPts;
    if (isShip) {
      // 船舶轨迹：每一步都做海域约束，保证在海里
      newPts = genShipTrack(center[0], center[1], steps, jitter);
    } else {
      var lng = center[0], lat = center[1];
      newPts = [];
      var dLng = (Math.random() - 0.5) * 0.08;
      var dLat = (Math.random() - 0.5) * 0.08;
      for (var i = 0; i < steps; i++) {
        newPts.push([lng, lat]);
        lng += dLng + (Math.random() - 0.5) * jitter;
        lat += dLat + (Math.random() - 0.5) * jitter;
        dLng *= 0.98; dLat *= 0.98;
      }
    }
    if (!SHIP_PLAY) SHIP_PLAY = {};
    SHIP_PLAY.fullTrack = newPts;
    SHIP_PLAY.samples = resampleTrack(newPts, 1001);
    SHIP_PLAY.progress = 0;
    SHIP_PLAY.playing = false;
    SHIP_PLAY.lastTs = 0;
    updateBigPlayBtn();
    updatePlayerUIProgress();
    renderFullTrack();
    moveMarkerToT(0);
  }

  function renderFullTrack() {
    if (!SHIP_PLAY || !SHIP_PLAY.ghostLine || !SHIP_PLAY.fullTrack) return;
    SHIP_PLAY.ghostLine.setPath(SHIP_PLAY.fullTrack);
    try {
      var AMap = window.AMap;
      var trackRaw = SHIP_PLAY.fullTrack;
      if (AMap && SHIP_PLAY.map && trackRaw.length > 1) {
        var lngs = trackRaw.map(function (p) { return p[0]; });
        var lats = trackRaw.map(function (p) { return p[1]; });
        var b = new AMap.Bounds(
          [Math.min.apply(null, lngs) - 0.05, Math.min.apply(null, lats) - 0.05],
          [Math.max.apply(null, lngs) + 0.05, Math.max.apply(null, lats) + 0.05]
        );
        SHIP_PLAY.map.setBounds(b, true, [30, 30, 30, 30]);
      }
    } catch (e) {}
  }

  function getPointAtT(t) {
    if (!SHIP_PLAY || !SHIP_PLAY.samples || !SHIP_PLAY.samples.length) return null;
    var n = SHIP_PLAY.samples.length;
    var idx = Math.max(0, Math.min(n - 1, Math.round(t * (n - 1))));
    return SHIP_PLAY.samples[idx];
  }
  function headingBetween(a, b) {
    if (!a || !b) return 0;
    var dx = b[0] - a[0];
    var dy = b[1] - a[1];
    if (dx === 0 && dy === 0) return 0;
    var rad = Math.atan2(dx, dy);
    var deg = rad * 180 / Math.PI;
    return (deg + 360) % 360;
  }

  function moveMarkerToT(t) {
    if (!SHIP_PLAY) return;
    t = Math.max(0, Math.min(1, t));
    var p = getPointAtT(t);
    if (!p) return;
    var pPrev = getPointAtT(Math.max(0, t - 0.002));
    var hdg = headingBetween(pPrev, p);
    if (SHIP_PLAY.shipMarker) {
      SHIP_PLAY.shipMarker.setPosition(p);
      // 使用高德原生 setAngle 方法旋转船舶图标,箭头方向跟随轨迹变动
      try { SHIP_PLAY.shipMarker.setAngle(hdg); } catch (e) {}
    }
    if (SHIP_PLAY.playLine && SHIP_PLAY.samples) {
      var n = SHIP_PLAY.samples.length;
      var endIdx = Math.max(1, Math.round(t * (n - 1)));
      SHIP_PLAY.playLine.setPath(SHIP_PLAY.samples.slice(0, endIdx + 1));
    }
    if (SHIP_PLAY.autoFollow && SHIP_PLAY.map) {
      try { SHIP_PLAY.map.panTo(p); } catch (e) {}
    }
  }

  function initShipTrackMap(AMap, item, forceType) {
    var mapEl = document.getElementById('shipMap');
    if (!mapEl) return;
    var trackRaw = (item.track && item.track.length) ? item.track.slice() : [item.pos || [121.5, 31.0]];
    // 后端真实数据不进行兜底处理(不复制轨迹点、不做海域吸附)
    var fromBackend = !!(item && item.fromBackend);
    if (!fromBackend) {
      while (trackRaw.length < 30) trackRaw = trackRaw.concat(trackRaw.slice(0, 20));
      // 船舶轨迹兜底修正：即使是旧缓存/外部传入的轨迹，也把所有不在海域内的点吸附回海里
      // 强制判定：URL type=ship 或 item 含有船舶专属字段
      var isShip = (forceType === 'ship') || !!(item && (item.shipType || item.mmsi || item.imo ||
        (item.type && /船|舰|艇|货|油|散|客|渔|勘|军/i.test(item.type))));
      if (isShip && typeof _snapShipPointToSea === 'function') {
        for (var i = 0; i < trackRaw.length; i++) {
          if (!trackRaw[i] || trackRaw[i].length < 2) continue;
          trackRaw[i] = _snapShipPointToSea(trackRaw[i][0], trackRaw[i][1]);
        }
      }
    }

    var center = trackRaw[Math.floor(trackRaw.length / 2)];
    var sat = new AMap.TileLayer.Satellite();
    var road = new AMap.TileLayer.RoadNet();
    var map = new AMap.Map('shipMap', {
      viewMode: '2D',
      mapStyle: 'amap://styles/normal',
      layers: [sat, road],
      zoom: 9,
      center: center,
      resizeEnable: true
    });
    if (map.FeatureLayer) {
      try { map.setFeatures(['bg', 'road']); } catch (e) {}
    }
    var ghostLine = new AMap.Polyline({
      path: trackRaw,
      strokeColor: '#fb923c',
      strokeWeight: 4,
      strokeOpacity: 0.32,
      strokeStyle: 'dashed',
      lineJoin: 'round',
      lineCap: 'round',
      zIndex: 10
    });
    var playLine = new AMap.Polyline({
      path: [trackRaw[0], trackRaw[0]],
      strokeColor: '#fb923c',
      strokeWeight: 6,
      strokeOpacity: 0.95,
      lineJoin: 'round',
      lineCap: 'round',
      zIndex: 20
    });
    var shipMarker = new AMap.Marker({
      position: trackRaw[0],
      anchor: 'center',
      zIndex: 99,
      angle: (item.heading || 0),
      content:
        '<div style="position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;">' +
          '<div style="position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(74,222,128,0.55);box-shadow:0 0 18px rgba(74,222,128,0.45);"></div>' +
          '<div style="position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,rgba(74,222,128,0.35) 0%,transparent 70%);animation:tsShipPulse 2.2s ease-out infinite;"></div>' +
          '<svg viewBox="0 0 34 34" width="30" height="30" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));">' +
            '<defs><linearGradient id="svG1" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0%" stop-color="#86efac"/><stop offset="55%" stop-color="#22c55e"/><stop offset="100%" stop-color="#15803d"/></linearGradient>' +
              '<linearGradient id="svG2" x1="0" y1="0" x2="0" y2="1">' +
              '<stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs>' +
            '<path d="M17 3 L25 12 L27 26 L22 28 L17 29 L12 28 L7 26 L9 12 Z" fill="url(#svG1)" stroke="#064e3b" stroke-width="0.7"/>' +
            '<rect x="14" y="9" width="6" height="8" fill="url(#svG2)" stroke="#92400e" stroke-width="0.5"/>' +
            '<circle cx="17" cy="20" r="1.1" fill="#064e3b"/>' +
          '</svg>' +
        '</div>'
    });
    ghostLine.setMap(map);
    playLine.setMap(map);
    shipMarker.setMap(map);

    setTimeout(function () {
      try {
        if (trackRaw.length > 1) {
          var lngs = trackRaw.map(function (p) { return p[0]; });
          var lats = trackRaw.map(function (p) { return p[1]; });
          var b = new AMap.Bounds(
            [Math.min.apply(null, lngs) - 0.05, Math.min.apply(null, lats) - 0.05],
            [Math.max.apply(null, lngs) + 0.05, Math.max.apply(null, lats) + 0.05]
          );
          map.setBounds(b, true, [30, 30, 30, 30]);
        }
      } catch (e) {}
    }, 100);

    if (!SHIP_PLAY) SHIP_PLAY = {};
    SHIP_PLAY.map = map;
    SHIP_PLAY.satLayer = sat;
    SHIP_PLAY.roadLayer = road;
    SHIP_PLAY.fullTrack = trackRaw.slice();
    SHIP_PLAY.ghostLine = ghostLine;
    SHIP_PLAY.playLine = playLine;
    SHIP_PLAY.shipMarker = shipMarker;
    SHIP_PLAY.samples = resampleTrack(trackRaw, 1001);
    SHIP_PLAY.progress = 0.138;   // like screenshot
    SHIP_PLAY.playing = false;
    SHIP_PLAY.lastTs = 0;
    SHIP_PLAY.playbackDurationSec = 155; // 2m35s
    SHIP_PLAY.rate = 1.0;
    SHIP_PLAY.muted = false;
    SHIP_PLAY.autoFollow = true;

    moveMarkerToT(SHIP_PLAY.progress);
    updatePlayerUIProgress();
    updateBigPlayBtn();
  }

  // ========= Player UI =========
  function updateBigPlayBtn() {

    var iconPlay = document.getElementById('icon-play');

    if (bigPlay) {
      bigPlay.classList.toggle('pause', !!isPlaying);
      if (isPlaying) {
        bigPlay.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
      } else {
        bigPlay.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
      }
    }
    if (iconPlay) {
      iconPlay.innerHTML = isPlaying
        ? '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>'
        : '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>';
    }
  }
  function updatePlayerUIProgress() {
    if (!SHIP_PLAY) return;
    var totalSec = SHIP_PLAY.playbackDurationSec || 155;
    var curSec = Math.floor(totalSec * SHIP_PLAY.progress);
    var posEl = document.getElementById('player-pos');
    var totEl = document.getElementById('player-total');
    var remEl = document.getElementById('playerRemain');
    var slider = document.getElementById('playerSlider');
    var wm = document.getElementById('waveMask');
    if (posEl) posEl.textContent = formatDuration(curSec);
    if (totEl) totEl.textContent = formatDuration(totalSec);
    if (remEl) {
      var remain = Math.max(0, totalSec - curSec);
      var m = Math.floor(remain / 60);
      var s = remain % 60;
      remEl.textContent = '剩余时间 ' + m + 'm' + String(s).padStart(2, '0') + 's';
    }
    var pct = Math.max(0, Math.min(100, SHIP_PLAY.progress * 100));
    if (slider) {
      if (!SHIP_PLAY.userScrubbing) slider.value = String(Math.round(SHIP_PLAY.progress * 1000));
      slider.style.setProperty('--pct', pct.toFixed(2) + '%');
    }
    if (wm) wm.style.width = (100 - pct).toFixed(3) + '%';
  }
  function startPlayLoop() {
    if (!SHIP_PLAY) return;
    function tick(ts) {
      if (!SHIP_PLAY || !SHIP_PLAY.playing) return;
      if (SHIP_PLAY.lastTs === 0) SHIP_PLAY.lastTs = ts;
      var dt = (ts - SHIP_PLAY.lastTs) / 1000;
      SHIP_PLAY.lastTs = ts;
      var totalSec = SHIP_PLAY.playbackDurationSec || 155;
      var deltaT = (dt * (SHIP_PLAY.rate || 1)) / totalSec;
      SHIP_PLAY.progress = Math.max(0, Math.min(1, SHIP_PLAY.progress + deltaT));
      if (SHIP_PLAY.progress >= 1) {
        SHIP_PLAY.playing = false;
        SHIP_PLAY.progress = 1;
        moveMarkerToT(1);
        updateBigPlayBtn();
        updatePlayerUIProgress();
        return;
      }
      moveMarkerToT(SHIP_PLAY.progress);
      updatePlayerUIProgress();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function drawPlayerWaveform(item) {
    var cv = document.getElementById('playerWaveCanvas');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(300, Math.floor(rect.width * dpr));
    cv.height = Math.floor(28 * dpr);
    var ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.save();
    ctx.scale(dpr, dpr);
    var W = rect.width;
    var H = 28;
    var bars = 180;
    var barW = (W / bars);
    var baseSpeed = (item.speed || 12);
    for (var i = 0; i < bars; i++) {
      var t = i / (bars - 1);
      // 3 harmonics wave, with envelope to mimic screenshot waveform
      var amp = 0.55 +
        0.35 * Math.sin(t * 2 * Math.PI * 2.3 + 1.1) +
        0.12 * Math.sin(t * 2 * Math.PI * 6.7 + 0.4) +
        0.08 * Math.sin(t * 2 * Math.PI * 13.2);
      amp = Math.max(0.2, Math.min(1, amp));
      // baseline drift
      var drift = 0.08 * Math.sin(t * 2 * Math.PI * 0.6);
      amp = Math.max(0.1, amp + drift);
      var h = amp * (H * 0.86);
      var x = i * barW;
      var yTop = (H - h) / 2;
      var grd = ctx.createLinearGradient(0, yTop, 0, yTop + h);
      grd.addColorStop(0, 'rgba(56,189,248,0.95)');
      grd.addColorStop(0.5, 'rgba(129,140,248,0.95)');
      grd.addColorStop(1, 'rgba(192,132,252,0.95)');
      ctx.fillStyle = grd;
      // Thin bars
      var bw = Math.max(1, barW * 0.66);
      ctx.fillRect(x, yTop, bw, h);
      // center reference line
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(0, H / 2 - 0.4, W, 0.8);
    }
    // Simulate a vertical "needle" current-time mark by drawing marker
    ctx.restore();
  }

  function initPlayerUI(item) {
    var playBtn = document.getElementById('btn-play');
    var bigPlay = document.getElementById('shipBigPlay');
    function togglePlay() {
      if (!SHIP_PLAY) return;
      SHIP_PLAY.playing = !SHIP_PLAY.playing;
      SHIP_PLAY.lastTs = 0;
      updateBigPlayBtn();
      if (SHIP_PLAY.playing) startPlayLoop();
    }
    if (playBtn) playBtn.addEventListener('click', togglePlay);
    if (bigPlay) bigPlay.addEventListener('click', togglePlay);

    function step(deltaSec) {
      if (!SHIP_PLAY || !SHIP_PLAY.playbackDurationSec) return;
      SHIP_PLAY.progress = Math.max(0, Math.min(1, SHIP_PLAY.progress + deltaSec / SHIP_PLAY.playbackDurationSec));
      moveMarkerToT(SHIP_PLAY.progress);
      updatePlayerUIProgress();
    }
    var stepB = document.getElementById('btn-step-back');
    var stepF = document.getElementById('btn-step-fwd');
    if (stepB) stepB.addEventListener('click', function () { step(-10); });
    if (stepF) stepF.addEventListener('click', function () { step(10); });

    var slider = document.getElementById('playerSlider');
    if (slider) {
      slider.addEventListener('input', function () {
        if (!SHIP_PLAY) return;
        var v = parseInt(slider.value, 10);
        SHIP_PLAY.progress = Math.max(0, Math.min(1, v / 1000));
        moveMarkerToT(SHIP_PLAY.progress);
        updatePlayerUIProgress();
      });
      slider.addEventListener('mousedown', function () { if (SHIP_PLAY) SHIP_PLAY.userScrubbing = true; });
      slider.addEventListener('mouseup',   function () { if (SHIP_PLAY) SHIP_PLAY.userScrubbing = false; });
      slider.addEventListener('touchstart',function () { if (SHIP_PLAY) SHIP_PLAY.userScrubbing = true; });
      slider.addEventListener('touchend',  function () { if (SHIP_PLAY) SHIP_PLAY.userScrubbing = false; });
    }

    var speedBtn = document.getElementById('player-speed-btn');
    var speedMenu = document.getElementById('player-speed-menu');
    var shareBtn = document.getElementById('btn-share');
    var sharePopover = document.getElementById('share-popover');
    function closePopovers(keep) {
      if (speedMenu && keep !== 'speed') speedMenu.classList.remove('open');
      if (sharePopover && keep !== 'share') sharePopover.classList.remove('open');
    }
    if (speedBtn && speedMenu) {
      speedBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var isOpen = speedMenu.classList.toggle('open');
        if (isOpen) closePopovers('speed');
      });
      speedMenu.addEventListener('click', function (ev) {
        var target = ev.target && ev.target.closest && ev.target.closest('.player-speed-menu-item');
        if (!target) return;
        var rate = parseFloat(target.getAttribute('data-rate')) || 1;
        if (SHIP_PLAY) SHIP_PLAY.rate = rate;
        speedMenu.querySelectorAll('.player-speed-menu-item').forEach(function (it) {
          var on = parseFloat(it.getAttribute('data-rate')) === rate;
          it.classList.toggle('on', on);
          var sp = it.querySelector('span:last-child');
          if (sp) sp.textContent = on ? '✓' : '';
        });
        speedBtn.textContent = (rate === Math.round(rate) ? (rate + '.0') : String(rate)) + 'x ▾';
        speedMenu.classList.remove('open');
      });
    }
    var muteBtn = document.getElementById('btn-mute');
    if (muteBtn) {
      muteBtn.addEventListener('click', function () {
        if (!SHIP_PLAY) SHIP_PLAY = {};
        SHIP_PLAY.muted = !SHIP_PLAY.muted;
        muteBtn.style.color = SHIP_PLAY.muted ? 'var(--ts-warn)' : '';
        muteBtn.style.borderColor = SHIP_PLAY.muted ? 'rgba(251,146,60,0.35)' : '';
        if (SHIP_PLAY.muted) showToast('已静音'); else showToast('已开启声音');
      });
    }
    var fsBtn = document.getElementById('btn-fullscreen');
    if (fsBtn) {
      fsBtn.addEventListener('click', function () {
        var el = document.documentElement;
        var isFs = document.fullscreenElement || document.webkitFullscreenElement;
        try {
          if (isFs) {
            (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
          } else {
            (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || function () {}).call(el);
          }
        } catch (e) { showToast('当前环境不支持全屏'); }
      });
    }
    if (shareBtn && sharePopover) {
      shareBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var isOpen = sharePopover.classList.toggle('open');
        if (isOpen) closePopovers('share');
      });
      sharePopover.addEventListener('click', function (ev) {
        var sbi = ev.target && ev.target.closest && ev.target.closest('.sbi');
        if (!sbi) return;
        var kind = sbi.getAttribute('data-share');
        if (kind === 'copy') {
          var url = window.location.href;
          var done = function () { sharePopover.classList.remove('open'); showToast('链接已复制'); };
          try {
            if (navigator.clipboard) {
              navigator.clipboard.writeText(url).then(done, function () {
                var i = document.createElement('input');
                i.value = url; document.body.appendChild(i); i.select();
                try { document.execCommand('copy'); } catch (e) {}
                i.remove(); done();
              });
            } else {
              var i = document.createElement('input');
              i.value = url; document.body.appendChild(i); i.select();
              try { document.execCommand('copy'); } catch (e) {}
              i.remove(); done();
            }
          } catch (e) { done(); }
        } else if (kind === 'print') {
          try { window.print(); } catch (e) { showToast('无法打印'); }
        } else if (kind === 'kml') {
          if (!SHIP_PLAY || !SHIP_PLAY.fullTrack) { showToast('暂无轨迹可导出'); return; }
          var coordStr = SHIP_PLAY.fullTrack.map(function (p) { return p[0] + ',' + p[1] + ',0'; }).join('\n');
          var kml = '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' +
            escapeHtml(item.name || 'Track') + '</name><Placemark><LineString><tessellate>1</tessellate><coordinates>\n' +
            coordStr + '\n</coordinates></LineString></Placemark></Document></kml>';
          var blob2 = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
          var a2 = document.createElement('a');
          a2.href = URL.createObjectURL(blob2);
          a2.download = (item.name || 'track') + '.kml';
          a2.click();
          sharePopover.classList.remove('open');
          showToast('KML 已导出');
        }
      });
    }
    document.addEventListener('click', function () { closePopovers(null); });
  }

  // ========= Page entry =========
  // 从后端加载船舶真实数据(ais_track_huang 表历史轨迹)
  function loadShipFromBackend(mmsi) {
    return fetch('/api/ais/history?mmsi=' + encodeURIComponent(mmsi))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok || !res.data || !res.data.length) return null;
        var latest = res.data[res.data.length - 1]; // 最后一条为最新位置
        var track = res.data.map(function (r) {
          var lng = parseFloat(r.lon);
          var lat = parseFloat(r.lat);
          return [lng, lat];
        }).filter(function (p) { return !isNaN(p[0]) && !isNaN(p[1]); });
        return {
          id: mmsi,
          name: latest.ship_name || ('MMSI:' + mmsi),
          type: latest.ship_type || '船舶',
          mmsi: mmsi,
          imo: latest.imo || '-',
          callSign: latest.callsign || '-',
          shipType: latest.ship_type || '-',
          pos: [parseFloat(latest.lon), parseFloat(latest.lat)],
          heading: latest.heading != null ? parseFloat(latest.heading) : 0,
          speed: latest.sog != null ? parseFloat(latest.sog) : 0,
          track: track,
          destination: latest.destination || '-',
          draught: latest.draught != null ? latest.draught : '-',
          navStatus: latest.nav_status != null ? latest.nav_status : '-',
          dataUpdateTime: latest.last_update,
          fromBackend: true  // 标记数据来自后端,跳过 mock 兜底处理
        };
      });
  }

  (function pageInit() {
    var root = document.getElementById('app-root');
    var type = getQueryParam('type') || 'ship';
    var id = getQueryParam('id') || '';
    // 清旧版本缓存（含陆地轨迹），强制用新算法重新生成
    try {
      var ver = window.localStorage.getItem('ts_tac_ver');
      if (ver !== 'v2') {
        window.localStorage.removeItem('ts_tac_data_v1');
        window.localStorage.setItem('ts_tac_ver', 'v2');
      }
    } catch (e) {}

    // 船舶详情:优先从后端加载真实历史轨迹数据
    if (type === 'ship' && id) {
      loadShipFromBackend(id).then(function (item) {
        if (item) {
          renderShipLayout(type, item, root);
        } else {
          // 后端无数据,fallback 到本地 mock 数据
          var data = getTacticalData();
          var fbItem = findTarget(data, type, id) || {
            id: id, name: 'MMSI:' + id, mmsi: id,
            pos: [121.5, 31.0], track: [], type: '船舶'
          };
          renderShipLayout(type, fbItem, root);
        }
      }).catch(function () {
        var data = getTacticalData();
        var fbItem = findTarget(data, type, id) || {
          id: id, name: 'MMSI:' + id, mmsi: id,
          pos: [121.5, 31.0], track: [], type: '船舶'
        };
        renderShipLayout(type, fbItem, root);
      });
    } else {
      var data = getTacticalData();
      var item = findTarget(data, type, id);
      if (type === 'ship' && item) {
        renderShipLayout(type, item, root);
      } else {
        renderGenericCard(type, item, root);
      }
    }
  })();
</script>
