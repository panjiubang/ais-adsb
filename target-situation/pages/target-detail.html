<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标详情 - 目标监视</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script>
  window._AMapSecurityConfig = { securityJsCode: '' };
  window.AMAP_CONFIG = {
    key: '01d6322cc08dafd1800e07b018b06b49',
    version: '2.0',
    plugins: []
  };
  window.loadAMap = function () {
    return new Promise(function (resolve, reject) {
      if (window.AMap) return resolve(window.AMap);
      var cfg = window.AMAP_CONFIG || {};
      if (!cfg.key || cfg.key.indexOf('YOUR_') === 0) {
        var err = new Error('AMap key 未配置');
        err.code = 'AMAP_NO_KEY';
        return reject(err);
      }
      var src = 'https://webapi.amap.com/maps?v=' + (cfg.version || '2.0') + '&key=' + cfg.key;
      if (cfg.plugins && cfg.plugins.length) src += '&plugin=' + cfg.plugins.join(',');
      var s = document.createElement('script');
      s.type = 'text/javascript'; s.async = true; s.src = src;
      s.onload = function () { resolve(window.AMap); };
      s.onerror = function (e) { reject(e); };
      document.head.appendChild(s);
    });
  };
</script>
<style>
  :root {
    --ts-bg: #0B1220; --ts-bg-2: #070b14;
    --ts-surface: rgba(15,23,42,0.92);
    --ts-surface-2: rgba(21,30,48,0.96);
    --ts-border: rgba(148,163,184,0.18);
    --ts-border-2: rgba(148,163,184,0.30);
    --ts-ink: #e2e8f0; --ts-ink-2: #94a3b8; --ts-ink-3: #64748b;
    --ts-primary: #38bdf8; --ts-primary-dim: rgba(56,189,248,0.14);
    --ts-ship: #4ade80; --ts-aircraft: #f87171; --ts-satellite: #c084fc; --ts-port: #94a3b8;
    --ts-warn: #fb923c; --ts-radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh; height: 100%;
    font-family: "'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif";
    color: var(--ts-ink);
    background:
      radial-gradient(1200px 700px at 10% -10%, rgba(56,189,248,0.08), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(192,132,252,0.07), transparent 60%),
      linear-gradient(180deg, var(--ts-bg) 0%, var(--ts-bg-2) 100%);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* SHIP FULL LAYOUT */
  body.ship-layout { overflow: hidden; }
  .ship-app {
    display: flex; flex-direction: column; height: 100vh; width: 100%; min-height: 0;
  }
  .ship-topbar {
    height: 40px; display: flex; align-items: stretch; justify-content: space-between;
    background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(11,18,32,0.98));
    border-bottom: 1px solid var(--ts-border);
    padding: 0 6px 0 14px; flex-shrink: 0; gap: 10px;
  }
  .ship-topbar-left { display: flex; align-items: stretch; gap: 2px; min-width: 0; }
  .ship-tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 14px; height: 100%;
    font-size: 13px; color: var(--ts-ink-2);
    cursor: pointer; position: relative;
    border: 1px solid transparent; border-top: none; border-bottom: none;
    white-space: nowrap; max-width: 260px;
  }
  .ship-tab:hover { color: var(--ts-ink); background: rgba(255,255,255,0.02); }
  .ship-tab-flag { font-size: 14px; }
  .ship-tab-close {
    width: 16px; height: 16px; border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; color: var(--ts-ink-3);
    opacity: 0; transition: opacity .1s;
  }
  .ship-tab:hover .ship-tab-close { opacity: 1; }
  .ship-tab .ship-tab-close:hover { background: rgba(239,68,68,0.18); color: #fca5a5; }
  .ship-tab.ship-tab-active {
    color: var(--ts-ink); background: rgba(56,189,248,0.06);
  }
  .ship-tab.ship-tab-active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--ts-primary); box-shadow: 0 0 8px rgba(56,189,248,0.5);
  }
  .ship-topbar-right { display: flex; align-items: center; gap: 10px; padding-right: 8px; }
  .topbar-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--ts-border);
    background: rgba(255,255,255,0.02); color: var(--ts-ink-2);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
  }
  .topbar-btn:hover { color: var(--ts-ink); border-color: var(--ts-border-2); }
  .topbar-btn.vip {
    background: linear-gradient(135deg, rgba(251,146,60,0.25), rgba(239,68,68,0.22));
    color: #fed7aa; border-color: rgba(251,146,60,0.35);
  }
  .topbar-btn.vip:hover { filter: brightness(1.1); }
  .topbar-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, var(--ts-primary), var(--ts-satellite));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; color: #0B1220; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .ship-scroll {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 16px 20px 20px;
  }
  .ship-scroll::-webkit-scrollbar { width: 6px; }
  .ship-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.22); border-radius: 3px; }
  .ship-info {
    background: var(--ts-surface);
    border: 1px solid var(--ts-border);
    border-radius: 12px; overflow: hidden; margin-bottom: 14px;
    display: flex; flex-direction: row; gap: 0;
    backdrop-filter: blur(10px);
  }
  .ship-info-left {
    display: flex; flex-direction: row; gap: 16px;
    padding: 16px; flex-shrink: 0;
  }
  .ship-photo {
    width: 160px; height: 110px; border-radius: 8px; overflow: hidden;
    background: var(--ts-surface-2);
    border: 1px solid var(--ts-border-2);
    position: relative; flex-shrink: 0;
  }
  .ship-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ship-photo-flag {
    position: absolute; left: 8px; bottom: 8px; font-size: 18px;
    background: rgba(0,0,0,0.45); padding: 2px 6px; border-radius: 4px;
    backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
  }
  .ship-meta {
    display: flex; flex-direction: column; justify-content: space-between; min-width: 220px;
  }
  .ship-name-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ship-flag-lg {
    font-size: 22px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--ts-border);
    border-radius: 6px; padding: 2px 6px;
  }
  .ship-name { font-size: 18px; font-weight: 700; color: var(--ts-ink); letter-spacing: 0.3px; }
  .ship-name-sub { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .ship-name-sub .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 5px;
    font-size: 11px; color: var(--ts-ink-2);
    background: rgba(148,163,184,0.08);
    border: 1px solid var(--ts-border);
  }
  .ship-name-sub .tag:hover { color: var(--ts-ink); }
  .ship-name-sub .tag.prime {
    background: rgba(74,222,128,0.12);
    color: var(--ts-ship); border-color: rgba(74,222,128,0.28);
  }
  .ship-fav-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--ts-ink-2); }
  .ship-fav-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--ts-border);
    background: rgba(255,255,255,0.02); cursor: pointer; color: var(--ts-ink-2);
  }
  .ship-fav-btn:hover { color: var(--ts-warn); border-color: var(--ts-border-2); }
  .ship-fav-btn.on { color: var(--ts-warn); border-color: rgba(251,146,60,0.3); }
  .ship-info-right {
    flex: 1; display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: minmax(52px, auto);
    gap: 1px; background: var(--ts-border);
    border-left: 1px solid var(--ts-border);
    min-width: 0;
  }
  .ship-info-cell {
    background: var(--ts-surface);
    padding: 10px 16px;
    display: flex; flex-direction: column; justify-content: center; min-width: 0;
  }
  .ship-info-k {
    font-size: 11px; color: var(--ts-ink-3);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 5px;
  }
  .ship-info-v {
    font-size: 13px; color: var(--ts-ink);
    font-family: "'JetBrains Mono','Consolas',monospace";
    word-break: break-all;
  }
  .ship-info-v.ship-info-v-soft { font-family: inherit; color: var(--ts-ink-2); }
  .ship-info-v.good { color: var(--ts-ship); }
  .ship-info-v.neut { color: var(--ts-ink-2); }
  .ship-info-v.warn { color: var(--ts-warn); }

  .ship-timebar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    background: var(--ts-surface);
    border: 1px solid var(--ts-border);
    border-radius: 10px; padding: 10px 14px;
  }
  .ship-timebar-left {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--ts-ink-2);
  }
  .ship-timebar-left .dash { color: var(--ts-ink-3); padding: 0 2px; }
  .ship-timebar-left b {
    color: var(--ts-ink);
    font-family: "'JetBrains Mono','Consolas',monospace";
    font-weight: 500; letter-spacing: 0.3px;
  }
  .ship-timebar-right { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ship-time-quick {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 3px 8px; border-radius: 5px;
    font-size: 11px; color: var(--ts-ink-2);
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--ts-border);
    cursor: pointer;
  }
  .ship-time-quick:hover { color: var(--ts-ink); border-color: var(--ts-border-2); }
  .ship-time-quick.on { color: var(--ts-primary); border-color: rgba(56,189,248,0.35); background: var(--ts-primary-dim); }

  .ship-track {
    background: var(--ts-surface);
    border: 1px solid var(--ts-border);
    border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 0;
    height: calc(100vh - 40px - 32px - 158px - 14px - 50px - 14px);
  }
  .ship-track-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--ts-border);
    background: rgba(255,255,255,0.02);
    flex-shrink: 0;
  }
  .ship-track-title {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--ts-ink);
  }
  .ship-track-tools { display: inline-flex; align-items: center; gap: 4px; }
  .track-tool-btn {
    width: 28px; height: 28px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--ts-ink-2);
    border: 1px solid transparent; cursor: pointer;
    transition: all .15s;
  }
  .track-tool-btn:hover { background: rgba(255,255,255,0.04); color: var(--ts-ink); border-color: var(--ts-border); }
  .track-tool-btn.active { color: var(--ts-primary); background: var(--ts-primary-dim); border-color: rgba(56,189,248,0.28); }
  .ship-map-wrap {
    flex: 1; min-height: 0; position: relative; background: #0a1426;
  }
  #shipMap { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  .ship-map-overlay-play {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    color: #f8fafc; cursor: pointer; z-index: 10;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,255,255,0.04);
    transition: transform .15s ease, background .15s ease;
  }
  .ship-map-overlay-play:hover {
    background: rgba(56,189,248,0.75);
    transform: translate(-50%, -50%) scale(1.06);
  }
  .ship-map-overlay-play svg { margin-left: 3px; }
  .ship-map-overlay-play.pause svg { margin-left: 0; }
  @keyframes tsShipPulse {
    0% { transform: scale(0.5); opacity: 0.9; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .ship-player {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: linear-gradient(180deg, rgba(11,18,32,0.9), rgba(7,11,20,0.95));
    border-top: 1px solid var(--ts-border);
    height: 58px; flex-shrink: 0;
  }
  .player-left, .player-right {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--ts-ink-2);
    font-family: "'JetBrains Mono','Consolas',monospace";
    font-size: 12px; letter-spacing: 0.4px;
  }
  .player-btn {
    width: 32px; height: 32px; border-radius: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--ts-border);
    color: var(--ts-ink);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s;
  }
  .player-btn:hover { background: rgba(56,189,248,0.12); color: var(--ts-primary); border-color: rgba(56,189,248,0.28); }
  .player-btn.play {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, rgba(56,189,248,0.22), rgba(56,189,248,0.08));
    border-color: rgba(56,189,248,0.38);
    color: #e0f2fe;
  }
  .player-btn.play svg { margin-left: 1px; }
  .player-center {
    position: relative; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    gap: 3px; padding: 0 4px;
  }
  .player-wave {
    width: 100%; height: 28px;
    position: relative;
    border-radius: 4px; overflow: hidden;
    background: rgba(15,23,42,0.5);
    border: 1px solid var(--ts-border);
  }
  .player-wave canvas { width: 100%; height: 100%; display: block; }
  .player-wave-mask {
    position: absolute; top: 0; bottom: 0; right: 0;
    background: rgba(7,11,20,0.58);
    pointer-events: none;
  }
  .player-slider-wrap { position: relative; height: 6px; width: 100%; }
  .player-slider {
    position: absolute; inset: 0; height: 6px;
    -webkit-appearance: none; appearance: none; width: 100%;
    background: transparent; cursor: pointer; margin: 0; padding: 0;
  }
  .player-slider::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(90deg,
      var(--ts-primary) 0%,
      var(--ts-primary) var(--pct, 0%),
      rgba(148,163,184,0.22) var(--pct, 0%),
      rgba(148,163,184,0.22) 100%);
  }
  .player-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #f8fafc; border: 2px solid var(--ts-primary);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.25), 0 2px 8px rgba(0,0,0,0.5);
    margin-top: -4px;
  }
  .player-slider::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(148,163,184,0.22); }
  .player-slider::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--ts-primary); }
  .player-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #f8fafc; border: 2px solid var(--ts-primary);
  }
  .player-remain {
    font-size: 11px; color: var(--ts-ink-3);
    position: absolute; right: 2px; bottom: -16px;
    letter-spacing: 0.3px;
  }
  .player-speed {
    position: relative;
    display: inline-flex; align-items: center;
    padding: 4px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--ts-border);
    cursor: pointer; color: var(--ts-ink); font-size: 12px; user-select: none;
  }
  .player-speed:hover { border-color: var(--ts-border-2); color: var(--ts-primary); }
  .player-speed-menu {
    position: absolute; bottom: 38px; right: 0;
    min-width: 90px;
    background: var(--ts-surface-2);
    border: 1px solid var(--ts-border-2);
    border-radius: 8px; padding: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    z-index: 20; display: none;
  }
  .player-speed-menu.open { display: block; }
  .player-speed-menu-item {
    padding: 5px 10px; border-radius: 5px;
    font-size: 12px; color: var(--ts-ink-2);
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .player-speed-menu-item:hover { background: rgba(255,255,255,0.04); color: var(--ts-ink); }
  .player-speed-menu-item.on { color: var(--ts-primary); background: var(--ts-primary-dim); }
  .share-btn-popover {
    position: absolute; bottom: 38px; right: 0;
    min-width: 160px;
    background: var(--ts-surface-2);
    border: 1px solid var(--ts-border-2);
    border-radius: 8px; padding: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    z-index: 20; display: none;
  }
  .share-btn-popover.open { display: block; }
  .share-btn-popover .sbi {
    padding: 7px 10px; border-radius: 6px;
    font-size: 12px; color: var(--ts-ink-2); cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .share-btn-popover .sbi:hover { background: rgba(255,255,255,0.04); color: var(--ts-ink); }
  .toast {
    position: fixed; left: 50%; bottom: 100px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #f8fafc; padding: 8px 14px;
    border-radius: 6px; font-size: 12px;
    z-index: 999; pointer-events: none;
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  /* ============ OTHER TYPES (card layout) ============ */
  .page { max-width: 560px; margin: 0 auto; padding: 24px 16px 80px; }
  .back-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; font-size: 13px; color: var(--ts-ink-2);
  }
  .back-bar a {
    color: var(--ts-ink-2); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border: 1px solid var(--ts-border);
    border-radius: 8px; background: var(--ts-surface);
    transition: all .15s ease;
  }
  .back-bar a:hover { color: var(--ts-ink); border-color: var(--ts-border-2); }
  .meta-actions { display: inline-flex; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--ts-ink-2);
    background: var(--ts-surface); border: 1px solid var(--ts-border); border-radius: 8px;
  }
  .chip-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ts-primary); box-shadow: 0 0 0 3px var(--ts-primary-dim);
  }
  .detail-card {
    background: var(--ts-surface);
    border: 1px solid var(--ts-border);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.04) inset;
    overflow: hidden; backdrop-filter: blur(12px);
  }
  .detail-header {
    padding: 20px 20px 12px;
    display: flex; flex-direction: column; gap: 10px;
    border-bottom: 1px solid var(--ts-border);
  }
  .detail-title-row { display: flex; align-items: center; gap: 12px; }
  .detail-avatar {
    width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--ts-border-2);
    background: linear-gradient(135deg, var(--ts-primary-dim), rgba(148,163,184,0.08));
    display: flex; align-items: center; justify-content: center;
  }
  .detail-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-avatar-emoji { font-size: 28px; line-height: 1; }
  .detail-title-wrap { flex: 1; min-width: 0; }
  .detail-title { margin: 0; font-size: 22px; font-weight: 700; color: var(--ts-ink); letter-spacing: 0.2px; }
  .detail-subtitle {
    margin-top: 6px; font-size: 13px; color: var(--ts-ink-2);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .detail-sep { opacity: 0.45; color: var(--ts-ink-3); }
  .detail-type-badge {
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.3px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge-ship      { color: var(--ts-ship);      background: rgba(74,222,128,0.14);  border-color: rgba(74,222,128,0.25); }
  .badge-aircraft  { color: var(--ts-aircraft);  background: rgba(248,113,113,0.14); border-color: rgba(248,113,113,0.25); }
  .badge-satellite { color: var(--ts-satellite); background: rgba(192,132,252,0.14); border-color: rgba(192,132,252,0.25); }
  .badge-port      { color: var(--ts-port);      background: rgba(148,163,184,0.14); border-color: rgba(148,163,184,0.25); }

<body>

<script>
  // ========= Helpers =========
  function rnd(min, max) { return Math.random() * (max - min) + min; }
  function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function genId(prefix, n) {
    var s = ''; var hex = '0123456789ABCDEF';
    for (var i = 0; i < 4; i++) s += hex[Math.floor(Math.random() * 16)];
    return prefix + '-' + s + (n < 10 ? '0' + n : n);
  }
  function genTrack(centerLng, centerLat, steps, jitter) {
    var pts = []; var lng = centerLng, lat = centerLat;
    var dLng = rnd(-0.05, 0.05), dLat = rnd(-0.05, 0.05);
    for (var i = 0; i < steps; i++) {
      pts.push([lng, lat]);
      lng += dLng + rnd(-jitter, jitter);
      lat += dLat + rnd(-jitter, jitter);
      dLng *= 0.96; dLat *= 0.96;
    }
    return pts;
  }
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str == null ? '' : str)));
    return div.innerHTML;
  }
  function getQueryParam(key) {
    var qs = (window.location.search || '').replace(/^\?/, '');
    if (!qs) return '';
    var pairs = qs.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var p = pairs[i].split('=');
      if (decodeURIComponent(p[0] || '') === key) return decodeURIComponent(p[1] || '');
    }
    return '';
  }
  function formatDuration(seconds) {
    seconds = Math.max(0, Math.floor(seconds));
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    return m + ':' + String(s).padStart(2, '0');
  }
  function formatDateTime(d) {
    function z(n, w) { w = w || 2; return String(n).padStart(w, '0'); }
    return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()) +
      ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
  }
  function showToast(msg) {
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () {
      t.classList.remove('show');
      setTimeout(function () { t.remove(); }, 300);
    }, 1500);
  }

  // ========= Tactical data (prefer localStorage snapshot) =========

        followView: Math.random() > 0.5

    }
    var satTypes = ['遥感', '通信', '导航', '气象', '侦察', '商业'];

    var satCompanies = ['SpaceX', '中国航天', 'ESA', 'Roscosmos', 'Intelsat'];
    var countries = ['美国', '中国', '俄罗斯', '欧盟', '日本', '印度'];
    var satPayloads = ['Ku/Ka-band payload', '可见光相机', 'SAR雷达', '导航信号载荷', '气象传感器'];
    var launchSites = ['美国佛罗里达州卡纳维拉尔角', '中国酒泉卫星发射中心', '俄罗斯拜科努尔', '日本种子岛', '印度萨蒂什·达万'];
    for (var k = 0; k < 20; k++) {

      data.satellite.push({
        id: genId('SAT', k + 1), name: 'Star-' + (100 + k), type: satType,
        pos: [rnd(70, 140), rnd(15, 55)],
        heading: rnd(0, 360), speed: rnd(6.5, 7.9), altitude: rnd(400, 1200),

      { n: '营口港', p: [122.23, 40.00], c: '中国', r: '东北', code: 'CNYKI', cap: '800万TEU', depth: '12m' },
      { n: '日照港', p: [119.52, 35.38], c: '中国', r: '华东', code: 'CNRZH', cap: '900万TEU', depth: '15m' },
      { n: '烟台港', p: [121.39, 37.55], c: '中国', r: '华东', code: 'CNYTI', cap: '700万TEU', depth: '14m' },
      { n: '福州港', p: [119.30, 26.08], c: '中国', r: '华南', code: 'CNFZG', cap: '600万TEU', depth: '13m' },
      { n: '珠海港', p: [113.27, 22.25], c: '中国', r: '华南', code: 'CNZUH', cap: '500万TEU', depth: '14m' },

  }
  function getTacticalData() {
    try {
      var raw = window.localStorage.getItem('ts_tac_data_v1');
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && (parsed.ship || parsed.aircraft || parsed.satellite || parsed.port)) return parsed;
      }
    } catch (e) {}
    var fallback = generateTacticalDataFallback();

    return fallback;
  }
  function findTarget(data, type, id) {
    var pool = data && data[type];
    if (!Array.isArray(pool)) return null;
    for (var i = 0; i < pool.length; i++) {
      if (pool[i] && pool[i].id === id) return pool[i];
    }
    return pool[0] || null;
  }

  // ========= Track sampling + playback =========
  function resampleTrack(points, samples) {
    if (!points || points.length === 0) return [];
    if (points.length === 1) {
      var arr = [];
      for (var i = 0; i < samples; i++) arr.push([points[0][0], points[0][1]]);
      return arr;
    }
    var segLens = []; var total = 0;
    for (var i = 1; i < points.length; i++) {
      var dx = points[i][0] - points[i-1][0];
      var dy = points[i][1] - points[i-1][1];
      var d = Math.sqrt(dx*dx + dy*dy);
      segLens.push(d); total += d;
    }
    if (total === 0) {
      var arr2 = [];
      for (var j = 0; j < samples; j++) arr2.push([points[0][0], points[0][1]]);
      return arr2;
    }
    var cum = [0];
    for (var k = 0; k < segLens.length; k++) cum.push(cum[k] + segLens[k]);
    var out = [];
    for (var s = 0; s < samples; s++) {
      var target = (s / (samples - 1)) * total;
      var seg = 0;
      while (seg < segLens.length && cum[seg+1] < target) seg++;
      if (seg >= segLens.length) {
        out.push([points[points.length-1][0], points[points.length-1][1]]);
        continue;
      }
      var localT = (target - cum[seg]) / (segLens[seg] || 1);
      var x = points[seg][0] + (points[seg+1][0] - points[seg][0]) * localT;
      var y = points[seg][1] + (points[seg+1][1] - points[seg][1]) * localT;
      out.push([x, y]);
    }
    return out;
  }

  function regeneratePlayTrackForDays(item, days) {
    var base = (item.track && item.track.length) ? item.track.slice() : [item.pos || [121.5, 31.0]];
    var steps = Math.round(base.length * (days / 7)) + 8;
    steps = Math.min(120, Math.max(20, steps));
    var jitter = 0.015 + Math.min(0.12, days * 0.002);
    var center = base[Math.floor(base.length / 2)];
    var lng = center[0], lat = center[1];
    var newPts = [];
    var dLng = (Math.random() - 0.5) * 0.08;
    var dLat = (Math.random() - 0.5) * 0.08;
    for (var i = 0; i < steps; i++) {
      newPts.push([lng, lat]);
      lng += dLng + (Math.random() - 0.5) * jitter;
      lat += dLat + (Math.random() - 0.5) * jitter;
      dLng *= 0.98; dLat *= 0.98;
    }
    if (!SHIP_PLAY) SHIP_PLAY = {};
    SHIP_PLAY.fullTrack = newPts;
    SHIP_PLAY.samples = resampleTrack(newPts, 1001);
    SHIP_PLAY.progress = 0;
    SHIP_PLAY.playing = false;
    SHIP_PLAY.lastTs = 0;
    updateBigPlayBtn();
    updatePlayerUIProgress();
    renderFullTrack();
    moveMarkerToT(0);
  }

  function renderFullTrack() {
    if (!SHIP_PLAY || !SHIP_PLAY.ghostLine || !SHIP_PLAY.fullTrack) return;
    SHIP_PLAY.ghostLine.setPath(SHIP_PLAY.fullTrack);
    try {
      var AMap = window.AMap;
      var trackRaw = SHIP_PLAY.fullTrack;
      if (AMap && SHIP_PLAY.map && trackRaw.length > 1) {
        var lngs = trackRaw.map(function (p) { return p[0]; });
        var lats = trackRaw.map(function (p) { return p[1]; });
        var b = new AMap.Bounds(
          [Math.min.apply(null, lngs) - 0.05, Math.min.apply(null, lats) - 0.05],
          [Math.max.apply(null, lngs) + 0.05, Math.max.apply(null, lats) + 0.05]
        );
        SHIP_PLAY.map.setBounds(b, true, [30, 30, 30, 30]);
      }
    } catch (e) {}
  }

  function getPointAtT(t) {
    if (!SHIP_PLAY || !SHIP_PLAY.samples || !SHIP_PLAY.samples.length) return null;
    var n = SHIP_PLAY.samples.length;
    var idx = Math.max(0, Math.min(n - 1, Math.round(t * (n - 1))));
    return SHIP_PLAY.samples[idx];
  }
  function headingBetween(a, b) {
    if (!a || !b) return 0;
    var dx = b[0] - a[0];
    var dy = b[1] - a[1];
    if (dx === 0 && dy === 0) return 0;
    var rad = Math.atan2(dx, dy);
    var deg = rad * 180 / Math.PI;
    return (deg + 360) % 360;
  }

  function moveMarkerToT(t) {
    if (!SHIP_PLAY) return;
    t = Math.max(0, Math.min(1, t));
    var p = getPointAtT(t);
    if (!p) return;
    var pPrev = getPointAtT(Math.max(0, t - 0.002));
    var hdg = headingBetween(pPrev, p);
    if (SHIP_PLAY.shipMarker) {
      SHIP_PLAY.shipMarker.setPosition(p);
      try {
        var dom = SHIP_PLAY.shipMarker.getDom();
        if (dom) {
          var inner = dom.firstElementChild || dom;
          if (inner) inner.style.transform = 'rotate(' + hdg.toFixed(1) + 'deg)';
        }
      } catch (e) {}
    }
    if (SHIP_PLAY.playLine && SHIP_PLAY.samples) {
      var n = SHIP_PLAY.samples.length;
      var endIdx = Math.max(1, Math.round(t * (n - 1)));
      SHIP_PLAY.playLine.setPath(SHIP_PLAY.samples.slice(0, endIdx + 1));
    }
    if (SHIP_PLAY.autoFollow && SHIP_PLAY.map) {
      try { SHIP_PLAY.map.panTo(p); } catch (e) {}
    }
  }

          );

  function updatePlayerUIProgress() {
    if (!SHIP_PLAY) return;
    var totalSec = SHIP_PLAY.playbackDurationSec || 155;
    var curSec = Math.floor(totalSec * SHIP_PLAY.progress);
    var posEl = document.getElementById('player-pos');
    var totEl = document.getElementById('player-total');
    var remEl = document.getElementById('playerRemain');
    var slider = document.getElementById('playerSlider');
    var wm = document.getElementById('waveMask');
    if (posEl) posEl.textContent = formatDuration(curSec);
    if (totEl) totEl.textContent = formatDuration(totalSec);
    if (remEl) {
      var remain = Math.max(0, totalSec - curSec);
      var m = Math.floor(remain / 60);
      var s = remain % 60;
      remEl.textContent = '剩余时间 ' + m + 'm' + String(s).padStart(2, '0') + 's';
    }
    var pct = Math.max(0, Math.min(100, SHIP_PLAY.progress * 100));
    if (slider) {
      if (!SHIP_PLAY.userScrubbing) slider.value = String(Math.round(SHIP_PLAY.progress * 1000));
      slider.style.setProperty('--pct', pct.toFixed(2) + '%');
    }
    if (wm) wm.style.width = (100 - pct).toFixed(3) + '%';
  }
  function startPlayLoop() {
    if (!SHIP_PLAY) return;
    function tick(ts) {
      if (!SHIP_PLAY || !SHIP_PLAY.playing) return;
      if (SHIP_PLAY.lastTs === 0) SHIP_PLAY.lastTs = ts;
      var dt = (ts - SHIP_PLAY.lastTs) / 1000;
      SHIP_PLAY.lastTs = ts;
      var totalSec = SHIP_PLAY.playbackDurationSec || 155;
      var deltaT = (dt * (SHIP_PLAY.rate || 1)) / totalSec;
      SHIP_PLAY.progress = Math.max(0, Math.min(1, SHIP_PLAY.progress + deltaT));
      if (SHIP_PLAY.progress >= 1) {
        SHIP_PLAY.playing = false;
        SHIP_PLAY.progress = 1;
        moveMarkerToT(1);
        updateBigPlayBtn();
        updatePlayerUIProgress();
        return;
      }
      moveMarkerToT(SHIP_PLAY.progress);
      updatePlayerUIProgress();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function drawPlayerWaveform(item) {
    var cv = document.getElementById('playerWaveCanvas');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(300, Math.floor(rect.width * dpr));
    cv.height = Math.floor(28 * dpr);
    var ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.save();
    ctx.scale(dpr, dpr);
    var W = rect.width;
    var H = 28;
    var bars = 180;
    var barW = (W / bars);
    var baseSpeed = (item.speed || 12);
    for (var i = 0; i < bars; i++) {
      var t = i / (bars - 1);
      // 3 harmonics wave, with envelope to mimic screenshot waveform
      var amp = 0.55 +
        0.35 * Math.sin(t * 2 * Math.PI * 2.3 + 1.1) +
        0.12 * Math.sin(t * 2 * Math.PI * 6.7 + 0.4) +
        0.08 * Math.sin(t * 2 * Math.PI * 13.2);
      amp = Math.max(0.2, Math.min(1, amp));
      // baseline drift
      var drift = 0.08 * Math.sin(t * 2 * Math.PI * 0.6);
      amp = Math.max(0.1, amp + drift);
      var h = amp * (H * 0.86);
      var x = i * barW;
      var yTop = (H - h) / 2;
      var grd = ctx.createLinearGradient(0, yTop, 0, yTop + h);
      grd.addColorStop(0, 'rgba(56,189,248,0.95)');
      grd.addColorStop(0.5, 'rgba(129,140,248,0.95)');
      grd.addColorStop(1, 'rgba(192,132,252,0.95)');
      ctx.fillStyle = grd;
      // Thin bars
      var bw = Math.max(1, barW * 0.66);
      ctx.fillRect(x, yTop, bw, h);
      // center reference line
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(0, H / 2 - 0.4, W, 0.8);
    }
    // Simulate a vertical "needle" current-time mark by drawing marker
    ctx.restore();
  }

  function initPlayerUI(item) {
    var playBtn = document.getElementById('btn-play');
    var bigPlay = document.getElementById('shipBigPlay');
    function togglePlay() {
      if (!SHIP_PLAY) return;
      SHIP_PLAY.playing = !SHIP_PLAY.playing;
      SHIP_PLAY.lastTs = 0;
      updateBigPlayBtn();
      if (SHIP_PLAY.playing) startPlayLoop();
    }
    if (playBtn) playBtn.addEventListener('click', togglePlay);
    if (bigPlay) bigPlay.addEventListener('click', togglePlay);

    function step(deltaSec) {
      if (!SHIP_PLAY || !SHIP_PLAY.playbackDurationSec) return;
      SHIP_PLAY.progress = Math.max(0, Math.min(1, SHIP_PLAY.progress + deltaSec / SHIP_PLAY.playbackDurationSec));
      moveMarkerToT(SHIP_PLAY.progress);
      updatePlayerUIProgress();
    }
    var stepB = document.getElementById('btn-step-back');
    var stepF = document.getElementById('btn-step-fwd');
    if (stepB) stepB.addEventListener('click', function () { step(-10); });
    if (stepF) stepF.addEventListener('click', function () { step(10); });

    var slider = document.getElementById('playerSlider');
    if (slider) {
      slider.addEventListener('input', function () {
        if (!SHIP_PLAY) return;
        var v = parseInt(slider.value, 10);
        SHIP_PLAY.progress = Math.max(0, Math.min(1, v / 1000));
        moveMarkerToT(SHIP_PLAY.progress);
        updatePlayerUIProgress();
      });
      slider.addEventListener('mousedown', function () { if (SHIP_PLAY) SHIP_PLAY.userScrubbing = true; });
      slider.addEventListener('mouseup',   function () { if (SHIP_PLAY) SHIP_PLAY.userScrubbing = false; });
      slider.addEventListener('touchstart',function () { if (SHIP_PLAY) SHIP_PLAY.userScrubbing = true; });
      slider.addEventListener('touchend',  function () { if (SHIP_PLAY) SHIP_PLAY.userScrubbing = false; });
    }

    var speedBtn = document.getElementById('player-speed-btn');
    var speedMenu = document.getElementById('player-speed-menu');
    var shareBtn = document.getElementById('btn-share');
    var sharePopover = document.getElementById('share-popover');
    function closePopovers(keep) {
      if (speedMenu && keep !== 'speed') speedMenu.classList.remove('open');
      if (sharePopover && keep !== 'share') sharePopover.classList.remove('open');
    }
    if (speedBtn && speedMenu) {
      speedBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var isOpen = speedMenu.classList.toggle('open');
        if (isOpen) closePopovers('speed');
      });
      speedMenu.addEventListener('click', function (ev) {
        var target = ev.target && ev.target.closest && ev.target.closest('.player-speed-menu-item');
        if (!target) return;
        var rate = parseFloat(target.getAttribute('data-rate')) || 1;
        if (SHIP_PLAY) SHIP_PLAY.rate = rate;
        speedMenu.querySelectorAll('.player-speed-menu-item').forEach(function (it) {
          var on = parseFloat(it.getAttribute('data-rate')) === rate;
          it.classList.toggle('on', on);
          var sp = it.querySelector('span:last-child');
          if (sp) sp.textContent = on ? '✓' : '';
        });
        speedBtn.textContent = (rate === Math.round(rate) ? (rate + '.0') : String(rate)) + 'x ▾';
        speedMenu.classList.remove('open');
      });
    }
    var muteBtn = document.getElementById('btn-mute');
    if (muteBtn) {
      muteBtn.addEventListener('click', function () {
        if (!SHIP_PLAY) SHIP_PLAY = {};
        SHIP_PLAY.muted = !SHIP_PLAY.muted;
        muteBtn.style.color = SHIP_PLAY.muted ? 'var(--ts-warn)' : '';
        muteBtn.style.borderColor = SHIP_PLAY.muted ? 'rgba(251,146,60,0.35)' : '';
        if (SHIP_PLAY.muted) showToast('已静音'); else showToast('已开启声音');
      });
    }
    var fsBtn = document.getElementById('btn-fullscreen');
    if (fsBtn) {
      fsBtn.addEventListener('click', function () {
        var el = document.documentElement;
        var isFs = document.fullscreenElement || document.webkitFullscreenElement;
        try {
          if (isFs) {
            (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
          } else {
            (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || function () {}).call(el);
          }
        } catch (e) { showToast('当前环境不支持全屏'); }
      });
    }
    if (shareBtn && sharePopover) {
      shareBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var isOpen = sharePopover.classList.toggle('open');
        if (isOpen) closePopovers('share');
      });
      sharePopover.addEventListener('click', function (ev) {
        var sbi = ev.target && ev.target.closest && ev.target.closest('.sbi');
        if (!sbi) return;
        var kind = sbi.getAttribute('data-share');
        if (kind === 'copy') {
          var url = window.location.href;
          var done = function () { sharePopover.classList.remove('open'); showToast('链接已复制'); };
          try {
            if (navigator.clipboard) {
              navigator.clipboard.writeText(url).then(done, function () {
                var i = document.createElement('input');
                i.value = url; document.body.appendChild(i); i.select();
                try { document.execCommand('copy'); } catch (e) {}
                i.remove(); done();
              });
            } else {
              var i = document.createElement('input');
              i.value = url; document.body.appendChild(i); i.select();
              try { document.execCommand('copy'); } catch (e) {}
              i.remove(); done();
            }
          } catch (e) { done(); }
        } else if (kind === 'print') {
          try { window.print(); } catch (e) { showToast('无法打印'); }
        } else if (kind === 'kml') {
          if (!SHIP_PLAY || !SHIP_PLAY.fullTrack) { showToast('暂无轨迹可导出'); return; }
          var coordStr = SHIP_PLAY.fullTrack.map(function (p) { return p[0] + ',' + p[1] + ',0'; }).join('\n');
          var kml = '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' +
            escapeHtml(item.name || 'Track') + '</name><Placemark><LineString><tessellate>1</tessellate><coordinates>\n' +
            coordStr + '\n</coordinates></LineString></Placemark></Document></kml>';
          var blob2 = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
          var a2 = document.createElement('a');
          a2.href = URL.createObjectURL(blob2);
          a2.download = (item.name || 'track') + '.kml';
          a2.click();
          sharePopover.classList.remove('open');
          showToast('KML 已导出');
        }
      });
    }
    document.addEventListener('click', function () { closePopovers(null); });
  }

  // ========= Page entry =========
  (function pageInit() {
    var root = document.getElementById('app-root');
    var type = getQueryParam('type') || 'ship';
    var id = getQueryParam('id') || '';
    var data = getTacticalData();
    var item = findTarget(data, type, id);

    if (type === 'ship' && item) {
      renderShipLayout(type, item, root);
    } else {
      renderGenericCard(type, item, root);
    }
  })();
</script>
</body>
</html>
