<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>某海域DW态势</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --bg:#0B1220;
    --bg2:#0f1a2e;
    --bg3:#0d1526;
    --panel:#0f1a2e;
    --panel2:#101c33;
    --text:#e2e8f0;
    --text2:#94a3b8;
    --text3:#64748b;
    --border:#1e293b;
    --border2:#243349;
    --blue:#3b82f6;
    --red:#ef4444;
    --yellow:#eab308;
    --black:#64748b;
    --accent:#38bdf8;
    --nav-h:58px;
    --status-h:34px;
    --left-w:300px;
    --right-w:340px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    font-size:12px;
  }
  button{font-family:inherit;cursor:pointer;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:4px;padding:3px 8px;font-size:11px;transition:all .15s}
  button:hover{color:var(--text);border-color:var(--accent);background:rgba(56,189,248,.08)}
  button.active{color:var(--accent);border-color:var(--accent);background:rgba(56,189,248,.12)}
  input,select{font-family:inherit;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:4px;padding:3px 6px;font-size:11px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  input[type=checkbox]{accent-color:var(--accent);width:12px;height:12px;cursor:pointer;vertical-align:middle}
  input[type=range]{accent-color:var(--accent);height:4px;padding:0}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#2a3b54;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4b64}
  ::-webkit-scrollbar-track{background:transparent}
  .icon{width:14px;height:14px;display:inline-block;vertical-align:middle}

  #app{display:flex;flex-direction:column;height:100vh}

  /* ===== Top Nav ===== */
  .top-nav{
    height:var(--nav-h);flex-shrink:0;
    background:linear-gradient(180deg,#0a1424,#0d1830);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;
    padding:0 14px;
    overflow-x:auto;
  }
  .top-nav::-webkit-scrollbar{height:0}
  .nav-title{
    font-size:16px;font-weight:700;color:#fff;white-space:nowrap;
    letter-spacing:1px;
    text-shadow:0 0 10px rgba(56,189,248,.5);
  }
  .nav-title .badge{color:var(--accent);font-size:10px;margin-left:4px}
  .nav-group{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 8px;border-left:1px solid var(--border)}
  .nav-group:first-of-type{border-left:none}
  .nav-group .lbl{color:var(--text3);font-size:10px;margin-right:2px}
  .nav-sep{width:1px;height:24px;background:var(--border)}

  .playback{display:flex;align-items:center;gap:4px}
  .pb-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:4px}
  .pb-btn:hover{color:#fff}
  .pb-time{color:var(--accent);font-size:11px;font-family:Consolas,monospace;min-width:120px;text-align:center;background:rgba(56,189,248,.08);padding:3px 6px;border-radius:4px;border:1px solid rgba(56,189,248,.2)}

  .ds-check{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text2);cursor:pointer;white-space:nowrap}
  .ds-check:hover{color:var(--text)}

  .tool-btn{display:flex;align-items:center;gap:3px;padding:4px 8px;font-size:11px}

  /* ===== Main ===== */
  .main-area{flex:1;display:flex;overflow:hidden;min-height:0}

  /* ===== Left Panel ===== */
  .left-panel{
    width:var(--left-w);flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    transition:width .2s;
    overflow:hidden;
  }
  .left-panel.collapsed{width:0;border-right:none}
  .panel-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
  .ptab{
    flex:1;padding:8px 4px;text-align:center;font-size:11px;color:var(--text2);
    cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;
  }
  .ptab:hover{color:var(--text);background:rgba(56,189,248,.05)}
  .ptab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(56,189,248,.08)}
  .panel-body{flex:1;overflow-y:auto;padding:8px}
  .panel-body::-webkit-scrollbar{width:5px}

  .collapse-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:16px;height:48px;background:var(--panel2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--text2);z-index:10;font-size:10px;
  }
  .collapse-btn:hover{color:var(--accent)}
  .collapse-btn.left{right:-16px;border-radius:0 4px 4px 0}
  .collapse-btn.right{left:-16px;border-radius:4px 0 0 4px 0}

  .left-panel,.right-panel{position:relative}

  /* Stats row */
  .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .stat-chip{
    background:var(--bg3);border:1px solid var(--border2);border-radius:5px;
    padding:6px 8px;display:flex;align-items:center;justify-content:space-between;
  }
  .stat-chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
  .stat-chip .n{font-weight:700;font-size:14px}

  /* Tree / List */
  .group-title{
    font-size:11px;color:var(--text2);font-weight:600;
    padding:6px 4px;margin-top:4px;display:flex;align-items:center;gap:4px;
    border-bottom:1px dashed var(--border2);
  }
  .group-title .cnt{color:var(--text3);font-weight:400;margin-left:auto}

  .target-row{
    display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:center;
    padding:5px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent;
    margin:1px 0;font-size:11px;
  }
  .target-row:hover{background:var(--panel2);border-color:var(--border2)}
  .target-row.selected{background:rgba(56,189,248,.12);border-color:var(--accent)}
  .target-row .tcolor{width:8px;height:8px;border-radius:50%}
  .target-row .tname{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .target-row .ttype{color:var(--text3);font-size:10px}

  .data-table{width:100%;border-collapse:collapse;font-size:10.5px}
  .data-table th{
    text-align:left;padding:5px 4px;color:var(--text3);font-weight:600;
    border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--panel);z-index:1;
  }
  .data-table td{padding:5px 4px;border-bottom:1px solid var(--border);color:var(--text2)}
  .data-table tr{cursor:pointer}
  .data-table tr:hover td{background:var(--panel2);color:var(--text)}
  .data-table tr.selected td{background:rgba(56,189,248,.12);color:var(--text)}

  /* Formation tree */
  .formation-card{
    background:var(--bg3);border:1px solid var(--border2);border-radius:5px;
    margin-bottom:6px;overflow:hidden;
  }
  .formation-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px rgba(56,189,248,.3)}
  .formation-head{
    padding:6px 8px;display:flex;align-items:center;gap:6px;cursor:pointer;
    background:var(--panel2);font-weight:600;
  }
  .formation-head:hover{background:#16243f}
  .formation-head .fcolor{width:8px;height:8px;border-radius:2px}
  .formation-head .chev{margin-left:auto;transition:transform .15s;color:var(--text3)}
  .formation-card.open .chev{transform:rotate(90deg)}
  .formation-members{display:none;padding:4px 8px 6px 18px}
  .formation-card.open .formation-members{display:block}
  .formation-member{padding:3px 0;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
  .formation-member .mdot{width:6px;height:6px;border-radius:50%}

  /* Alerts */
  .alert-item{
    background:var(--bg3);border:1px solid var(--border2);border-left:3px solid var(--red);
    border-radius:4px;padding:7px 9px;margin-bottom:6px;cursor:pointer;transition:all .15s;
  }
  .alert-item:hover{border-color:var(--border2);background:var(--panel2)}
  .alert-item.selected{border-color:var(--accent);background:rgba(56,189,248,.08)}
  .alert-item.lvl-red{border-left-color:var(--red)}
  .alert-item.lvl-orange{border-left-color:#f97316}
  .alert-item.lvl-yellow{border-left-color:var(--yellow)}
  .alert-head{display:flex;align-items:center;gap:5px;margin-bottom:3px}
  .alert-level{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
  .alert-level.red{background:rgba(239,68,68,.18);color:#fca5a5}
  .alert-level.orange{background:rgba(249,115,22,.18);color:#fdba74}
  .alert-level.yellow{background:rgba(234,179,8,.18);color:#fde047}
  .alert-title{font-size:11px;color:var(--text);flex:1}
  .alert-meta{font-size:10px;color:var(--text3);display:flex;gap:8px;margin-top:3px}
  .alert-status{font-size:10px;padding:1px 5px;border-radius:3px}
  .alert-status.unprocessed{color:#fca5a5;background:rgba(239,68,68,.12)}
  .alert-status.verified{color:#fde047;background:rgba(234,179,8,.12)}
  .alert-status.archived{color:#94a3b8;background:rgba(100,116,139,.12)}

  /* Filter */
  .filter-section{margin-bottom:10px}
  .filter-section h4{font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:600;display:flex;align-items:center;gap:4px}
  .filter-options{display:flex;flex-wrap:wrap;gap:5px}
  .filter-chip{
    padding:3px 8px;border:1px solid var(--border2);border-radius:12px;
    font-size:10px;color:var(--text2);cursor:pointer;transition:all .15s;
  }
  .filter-chip:hover{border-color:var(--accent);color:var(--text)}
  .filter-chip.active{background:rgba(56,189,248,.15);border-color:var(--accent);color:var(--accent)}
  .filter-chip.blue.active{background:rgba(59,130,246,.18);border-color:var(--blue);color:#93c5fd}
  .filter-chip.red.active{background:rgba(239,68,68,.18);border-color:var(--red);color:#fca5a5}
  .filter-chip.yellow.active{background:rgba(234,179,8,.18);border-color:var(--yellow);color:#fde047}
  .filter-chip.black.active{background:rgba(100,116,139,.18);border-color:var(--black);color:#cbd5e1}

  /* ===== Map ===== */
  .map-container{flex:1;position:relative;min-width:0;background:#06101f}
  #map{position:absolute;inset:0}
  .map-toolbar{
    position:absolute;top:10px;right:10px;z-index:5;
    display:flex;flex-direction:column;gap:4px;
    background:rgba(15,26,46,.9);backdrop-filter:blur(6px);
    border:1px solid var(--border2);border-radius:6px;padding:4px;
  }
  .mt-btn{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:4px;color:var(--text2);cursor:pointer;background:transparent;
  }
  .mt-btn:hover{background:var(--panel2);color:var(--accent)}
  .mt-btn.active{background:rgba(56,189,248,.15);color:var(--accent)}

  .map-legend{
    position:absolute;bottom:44px;left:10px;z-index:5;
    background:rgba(15,26,46,.9);backdrop-filter:blur(6px);
    border:1px solid var(--border2);border-radius:6px;padding:8px 10px;
    font-size:10px;
  }
  .map-legend h5{font-size:10px;color:var(--text3);margin-bottom:5px;font-weight:600}
  .legend-row{display:flex;align-items:center;gap:6px;margin:3px 0;color:var(--text2)}
  .legend-row .ls{width:18px;height:8px;border-radius:2px}
  .legend-row .ld{width:10px;height:10px;border-radius:50%}

  .playback-bar{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:5;
    background:rgba(15,26,46,.92);backdrop-filter:blur(6px);
    border:1px solid var(--border2);border-radius:8px;padding:6px 14px;
    display:flex;align-items:center;gap:10px;min-width:560px;
  }
  .pb-slider{flex:1;min-width:180px}
  .pb-frame{color:var(--accent);font-family:Consolas,monospace;font-size:11px;min-width:80px;text-align:center}

  .tooltip-card{
    position:absolute;z-index:1000;background:rgba(8,16,30,.96);
    border:1px solid var(--accent);border-radius:6px;padding:8px 10px;
    font-size:11px;color:var(--text);min-width:180px;pointer-events:none;
    box-shadow:0 4px 20px rgba(0,0,0,.5);display:none;
  }
  .tooltip-card .tt-title{font-weight:700;margin-bottom:4px;color:#fff;border-bottom:1px solid var(--border);padding-bottom:3px}
  .tooltip-card .tt-row{display:flex;justify-content:space-between;gap:10px;margin:2px 0}
  .tooltip-card .tt-row span:first-child{color:var(--text3)}

  .ctx-menu{
    position:fixed;z-index:2000;background:var(--panel2);
    border:1px solid var(--border2);border-radius:5px;padding:4px 0;
    box-shadow:0 6px 24px rgba(0,0,0,.6);display:none;min-width:150px;
  }
  .ctx-item{padding:6px 14px;font-size:11px;color:var(--text2);cursor:pointer}
  .ctx-item:hover{background:rgba(56,189,248,.12);color:var(--accent)}

  /* ===== Right Panel ===== */
  .right-panel{
    width:var(--right-w);flex-shrink:0;
    background:var(--panel);
    border-left:1px solid var(--border);
    display:flex;flex-direction:column;
    transition:width .2s;overflow:hidden;
  }
  .right-panel.collapsed{width:0;border-left:none}
  .rp-header{
    padding:8px 10px;border-bottom:1px solid var(--border);
    background:var(--bg2);flex-shrink:0;
  }
  .rp-header .rh-title{font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
  .rp-header .rh-sub{font-size:10px;color:var(--text3);margin-top:2px}
  .rp-body{flex:1;overflow-y:auto;padding:10px}
  .rp-body::-webkit-scrollbar{width:5px}

  .info-grid{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;font-size:11px;margin-bottom:8px}
  .info-grid .ik{color:var(--text3)}
  .info-grid .iv{color:var(--text)}
  .info-section{margin-bottom:12px}
  .info-section h5{
    font-size:11px;color:var(--accent);font-weight:600;margin-bottom:6px;
    padding-bottom:4px;border-bottom:1px solid var(--border2);
    display:flex;align-items:center;gap:5px;
  }

  .aff-picker{display:flex;gap:5px;margin:5px 0}
  .aff-opt{
    padding:3px 10px;border:1px solid var(--border2);border-radius:12px;
    font-size:10px;cursor:pointer;display:flex;align-items:center;gap:4px;
  }
  .aff-opt .ad{width:8px;height:8px;border-radius:50%}
  .aff-opt.active.我方{background:rgba(59,130,246,.18);border-color:var(--blue);color:#93c5fd}
  .aff-opt.active.外方{background:rgba(239,68,68,.18);border-color:var(--red);color:#fca5a5}
  .aff-opt.active.中立{background:rgba(234,179,8,.18);border-color:var(--yellow);color:#fde047}
  .aff-opt.active.未知{background:rgba(100,116,139,.18);border-color:var(--black);color:#cbd5e1}

  .chart-box{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:6px;margin-bottom:8px}
  .chart-box .cb-title{font-size:10px;color:var(--text3);margin-bottom:4px}
  canvas.chart{width:100%;height:90px;display:block}

  .key-node{
    display:grid;grid-template-columns:60px 1fr auto;gap:6px;font-size:10.5px;
    padding:4px 6px;border-bottom:1px solid var(--border);
  }
  .key-node .kn-t{color:var(--text3);font-family:Consolas,monospace}
  .key-node .kn-p{color:var(--text2)}
  .key-node .kn-e{font-size:10px}
  .key-node .kn-e.抵近警戒圈{color:#fca5a5}
  .key-node .kn-e.信号丢失{color:#fdba74}
  .key-node .kn-e.转向{color:#93c5fd}
  .key-node .kn-e.编队会合{color:#86efac}

  .person-row{
    display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
    padding:5px 6px;background:var(--bg3);border:1px solid var(--border2);
    border-radius:4px;margin-bottom:4px;font-size:11px;
  }
  .person-row .pr-name{color:var(--text);font-weight:600}
  .person-row .pr-meta{color:var(--text3);font-size:10px;margin-top:2px}
  .person-row .pr-actions{display:flex;gap:3px}
  .mini-btn{padding:2px 5px;font-size:10px;border-radius:3px}

  textarea{
    width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border2);
    border-radius:4px;padding:6px;font-size:11px;font-family:inherit;resize:vertical;outline:none;
  }
  textarea:focus{border-color:var(--accent)}

  .risk-picker{display:flex;gap:6px;margin:6px 0}
  .risk-opt{padding:4px 12px;border:1px solid var(--border2);border-radius:4px;font-size:11px;cursor:pointer;font-weight:600}
  .risk-opt.active.high{background:rgba(239,68,68,.18);border-color:var(--red);color:#fca5a5}
  .risk-opt.active.mid{background:rgba(234,179,8,.18);border-color:var(--yellow);color:#fde047}
  .risk-opt.active.low{background:rgba(34,197,94,.18);border-color:#22c55e;color:#86efac}

  .empty-state{text-align:center;color:var(--text3);padding:40px 20px;font-size:11px}
  .empty-state .icon{width:32px;height:32px;color:var(--text3);margin-bottom:8px}

  /* ===== Status Bar ===== */
  .status-bar{
    height:var(--status-h);flex-shrink:0;
    background:linear-gradient(180deg,#0a1424,#08101e);
    border-top:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:0 14px;
    font-size:10.5px;color:var(--text2);overflow-x:auto;
  }
  .status-bar::-webkit-scrollbar{height:0}
  .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .sb-item .lbl{color:var(--text3)}
  .sb-item .val{color:var(--text);font-family:Consolas,monospace}
  .sb-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e}
  .sb-dot.warn{background:var(--red);box-shadow:0 0 6px var(--red)}
  .sb-sep{width:1px;height:14px;background:var(--border)}

  /* Map markers */
  .amap-mk{position:relative;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);cursor:pointer}
  .mk-body{
    width:18px;height:18px;border-radius:50%;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;font-size:10px;
    box-shadow:0 0 6px rgba(0,0,0,.6);
  }
  .mk-arrow{
    position:absolute;top:-6px;left:50%;width:0;height:0;
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-bottom:6px solid currentColor;transform:translateX(-50%);transform-origin:50% 24px;
  }
  .mk-label{
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    font-size:9px;color:#fff;background:rgba(8,16,30,.8);padding:1px 5px;border-radius:2px;
    white-space:nowrap;border:1px solid rgba(255,255,255,.1);
  }
  .mk-pulse{
    position:absolute;top:0;left:50%;width:18px;height:18px;border-radius:50%;
    transform:translate(-50%,0);border:2px solid currentColor;
    animation:pulse 1.8s ease-out infinite;pointer-events:none;
  }
  @keyframes pulse{
    0%{transform:translate(-50%,0) scale(1);opacity:.7}
    100%{transform:translate(-50%,0) scale(2.8);opacity:0}
  }
  .amap-mk.selected .mk-body{box-shadow:0 0 0 3px rgba(56,189,248,.6),0 0 12px rgba(56,189,248,.8)}

  .rp-body .scroll-x{overflow-x:auto}
</style>
</head>
<body>
<div id="app">

  <!-- ===== TOP NAV ===== -->
  <header class="top-nav">
    <div class="nav-title">某海域DW态势<span class="badge">v2.0</span></div>

    <div class="nav-group">
      <i data-lucide="clock" class="icon" style="color:var(--accent)"></i>
      <span class="lbl">时段</span>
      <select id="timeRange">
        <option value="12h">近12h</option>
        <option value="24h" selected>近24h</option>
        <option value="7d">近7天</option>
        <option value="custom">自定义</option>
      </select>
    </div>

    <div class="nav-group playback">
      <button class="pb-btn" id="pbBack" title="后退"><i data-lucide="skip-back" class="icon"></i></button>
      <button class="pb-btn" id="pbPlay" title="播放"><i data-lucide="play" class="icon"></i></button>
      <button class="pb-btn" id="pbPause" title="暂停" style="display:none"><i data-lucide="pause" class="icon"></i></button>
      <button class="pb-btn" id="pbFwd" title="前进"><i data-lucide="skip-forward" class="icon"></i></button>
      <select id="pbSpeed" style="width:60px">

/* ===================== TRAJECTORY GEN ===================== */
function genTrajectory(t){
  const n=7, pts=[];
  const baseLat=t.lat, baseLng=t.lng;
  const events = t.aff==='外方' ? [null,null,'抵近警戒圈',null,'转向',null,null]
              : t.status==='信号丢失' ? [null,null,null,'信号丢失',null,null,null]
              : t.aff==='我方' ? [null,null,null,null,'编队会合',null,null]
              : [null,null,null,null,null,null,null];
  const seed = parseInt((t.mmsi||t.icao||t.manId||'1').replace(/\D/g,''))||1;
  let rng = mulberry32(seed);
  for(let i=0;i<n;i++){
    const frac = i/(n-1);
    const lat = baseLat - (1-frac)*(rng()*0.06-0.03);
    const lng = baseLng - (1-frac)*(rng()*0.06-0.03);
    const spd = t.speed!=null ? Math.max(0, t.speed*(0.7+rng()*0.6)) : null;
    pts.push({
      idx:i,
      time:new Date(Date.now()-(n-1-i)*30*60000),
      lng, lat,
      speed:spd,
      alt: t.alt!=null ? Math.max(0,t.alt*(0.85+rng()*0.3)) : null,
      event:events[i]
    });
  }
  return pts;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
targets.forEach(t=>t.traj=genTrajectory(t));

function mkIcon(t){

    <div class="mk-body" style="background:${c}">${icon}</div>
    <div class="mk-label">${t.name}</div>
  </div>`;
}

function createTargetMarker(t){
  const marker = new AMap.Marker({
    position:[t.lng,t.lat],
    content:mkIcon(t),
    offset:new AMap.Pixel(0,0),
    map:map,zIndex:100
  });
  marker.on('mouseover',e=>showTooltip(t,e));
  marker.on('mouseout',hideTooltip);
  marker.on('click',()=>{ selectTarget(t.id,true); });
  markers[t.id]=marker;
}

function drawTrajectory(t){
  const c = AFF_COLOR[t.aff];
  const path = t.traj.map(p=>[p.lng,p.lat]);
  // 主轨迹线
  const line = new AMap.Polyline({
    path:path, strokeColor:c, strokeWeight:2, strokeOpacity:0.7,
    strokeStyle: t.status==='信号丢失' ? 'dashed' : 'solid',
    map:map,zIndex:80
  });
  trajLines[t.id]=line;
  // 轨迹节点
  const dots = t.traj.map((p,i)=>{
    return new AMap.CircleMarker({
      center:[p.lng,p.lat], radius:3,
      fillColor: p.event? '#fbbf24' : c, fillOpacity:0.95,
      strokeColor:'#fff',strokeWeight:0.5,
      map:map,zIndex:90
    });
  });
  trajDots[t.id]=dots;
}

}

/* ===================== SELECT ===================== */
function selectTarget(id,pan){
  selectedTargetId=id;
  selectedAlertId=null;
  const t=targets.find(x=>x.id===id);
  if(!t) return;
  // marker highlight
  document.querySelectorAll('.amap-mk').forEach(m=>m.classList.remove('selected'));
  if(markers[id]){
    const el=markers[id].getContentElement();
    if(el) el.querySelector('.amap-mk')?.classList.add('selected');
    markers[id].getContentElement && (markers[id].getContentElement().querySelector('.amap-mk')?.classList.add('selected'));
  }
  if(pan){ map.setZoomAndCenter(11,[t.lng,t.lat]); }
  renderRight(t);
  if(leftTab==='overview') renderOverview();
}
function selectFormation(id){
  selectedFormationId = selectedFormationId===id?null:id;
  // clear bboxes
  Object.values(bboxOverlays).forEach(o=>{o.setMap(null);});
  bboxOverlays={};
  if(selectedFormationId){
    const f=formations.find(x=>x.id===selectedFormationId);
    const members=f.members.map(mid=>targets.find(t=>t.id===mid)).filter(Boolean);
    if(members.length){
      const lats=members.map(m=>m.lat), lngs=members.map(m=>m.lng);
      const minLat=Math.min(...lats)-0.02,maxLat=Math.max(...lats)+0.02;
      const minLng=Math.min(...lngs)-0.02,maxLng=Math.max(...lngs)+0.02;
      const c=AFF_COLOR[f.aff];
      const bbox=new AMap.Polygon({
        path:[[minLng,minLat],[maxLng,minLat],[maxLng,maxLat],[minLng,maxLat]],
        fillColor:c,fillOpacity:0.06,strokeColor:c,strokeWeight:2,
        strokeStyle:'dashed',strokeDasharray:[8,4],map:map,zIndex:70
      });
      bboxOverlays[f.id]=bbox;
      map.setFitView([bbox]);
    }
  }
  renderFormations();
}

/* ===================== CHARTS ===================== */
function drawCharts(t){
  const spdCanvas=document.getElementById('spdChart');
  if(spdCanvas) drawLineChart(spdCanvas,t.traj.map(p=>({x:p.idx,y:p.speed,label:'节'})),'节');
  const altCanvas=document.getElementById('altChart');
  if(altCanvas && t.alt!=null) drawLineChart(altCanvas,t.traj.map(p=>({x:p.idx,y:p.alt,label:'m'})),'m');
}
function drawLineChart(canvas,data,unit){
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth, h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const pad={l:28,r:8,t:8,b:18};
  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const ys=data.map(d=>d.y).filter(v=>v!=null);
  if(!ys.length) return;
  const yMin=Math.min(...ys,0), yMax=Math.max(...ys,1);
  // grid
  ctx.strokeStyle='#1e293b'; ctx.lineWidth=1;
  ctx.fillStyle='#64748b'; ctx.font='9px Consolas';
  for(let i=0;i<=3;i++){
    const y=pad.t+ch*i/3;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    const v=yMax-(yMax-yMin)*i/3;
    ctx.fillText(v.toFixed(0),2,y+3);
  }
  // line
  ctx.strokeStyle='#38bdf8'; ctx.lineWidth=1.8;
  ctx.beginPath();
  data.forEach((d,i)=>{
    const x=pad.l+cw*i/(data.length-1);
    const y=pad.t+ch*(1-(d.y-yMin)/(yMax-yMin||1));
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // points
  data.forEach((d,i)=>{
    const x=pad.l+cw*i/(data.length-1);
    const y=pad.t+ch*(1-(d.y-yMin)/(yMax-yMin||1));
    ctx.fillStyle=d.event||i===data.length-1?'#fbbf24':'#38bdf8';
    ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill();
  });
}

/* ===================== TAB SWITCHING ===================== */
function switchLeftTab(tab){
  leftTab=tab;
  document.querySelectorAll('[data-ltab]').forEach(x=>x.classList.toggle('active',x.dataset.ltab===tab));
  renderLeft();
}
function switchRightTab(tab){
  rightTab=tab;
  document.querySelectorAll('[data-rtab]').forEach(x=>x.classList.toggle('active',x.dataset.rtab===tab));
  if(selectedTargetId) renderRightTab(targets.find(t=>t.id===selectedTargetId));
}

  vt.forEach(t=>stats[t.aff]++);

  document.getElementById('statusBar').innerHTML=`
    <div class="sb-item"><i data-lucide="crosshair" class="icon"></i><span class="lbl">中心</span><span class="val">${center.lng.toFixed(3)},${center.lat.toFixed(3)}</span></div>
    <div class="sb-sep"></div>
    <div class="sb-item"><i data-lucide="zoom-in" class="icon"></i><span class="lbl">层级</span><span class="val">${zoom.toFixed(1)}</span></div>
    <div class="sb-item"><span class="lbl">比例尺</span><span class="val">≈${scaleKm}km</span></div>
    <div class="sb-sep"></div>
    <div class="sb-item"><span class="lbl">目标</span><span class="val" style="color:var(--blue)">我方${stats['我方']}</span><span class="val" style="color:var(--red)">外方${stats['外方']}</span><span class="val" style="color:var(--yellow)">中立${stats['中立']}</span><span class="val" style="color:#cbd5e1">未知${stats['未知']}</span></div>
    <div class="sb-sep"></div>
    <div class="sb-item"><i data-lucide="radio" class="icon"></i><span class="lbl">AIS</span><span class="val">${fmtTime(new Date(Date.now()-60000))}</span></div>
    <div class="sb-item"><i data-lucide="radio" class="icon"></i><span class="lbl">ADS-B</span><span class="val">${fmtTime(new Date(Date.now()-45000))}</span></div>
    <div class="sb-item"><span class="lbl">情报</span><span class="val">${vt.length}条</span></div>
    <div class="sb-sep"></div>
    <div class="sb-item"><span class="sb-dot ${unproc>0?'warn':''}"></span><span class="lbl">告警</span><span class="val" style="color:${unproc>0?'#fca5a5':'#22c55e'}">未处置 ${unproc}</span></div>
    <div class="sb-sep"></div>
    <div class="sb-item"><i data-lucide="clock" class="icon"></i><span class="lbl">分析时段</span><span class="val">近24h</span></div>
    <div class="sb-item"><i data-lucide="activity" class="icon"></i><span class="lbl">更新</span><span class="val">${fmtTime(new Date())}</span></div>
    <div class="sb-sep"></div>
    <div class="sb-item"><span class="sb-dot"></span><span class="lbl">数据状态</span><span class="val" style="color:#22c55e">正常</span></div>`;

/* ===================== PLAYBACK ===================== */
function setFrame(idx){
  playbackFrame=idx;
  document.getElementById('pbSlider').value=idx;
  document.getElementById('pbFrame').textContent = idx===6?'实时':'T-'+(6-idx);
  document.getElementById('pbTime').textContent = idx===6?'实时 '+fmtTime(new Date()):fmtTime(targets[0].traj[idx].time);
  targets.forEach(t=>{
    const p=t.traj[idx];
    if(p&&markers[t.id]) markers[t.id].setPosition([p.lng,p.lat]);
  });
}
function play(){
  isPlaying=true;
  document.getElementById('pbPlay').style.display='none';
  document.getElementById('pbPause').style.display='flex';
  pbTimer=setInterval(()=>{
    let next=(playbackFrame-1+7)%7;
    if(next===6) next=0;
    setFrame(next);
  },1000/Math.max(pbSpeed,0.25)*2);
}
function pause(){
  isPlaying=false;
  document.getElementById('pbPlay').style.display='flex';
  document.getElementById('pbPause').style.display='none';
  clearInterval(pbTimer);
}

/* ===================== UTILS ===================== */
function fmtTime(d){
  d=new Date(d);
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function initIcons(){
  if(window.lucide && typeof lucide.createIcons === 'function'){
    try{ lucide.createIcons(); }catch(e){}
  } else {
    setTimeout(initIcons, 50);
  }
}

setTimeout(initIcons, 1500);
setTimeout(initIcons, 3000);

  // playback
  document.getElementById('pbSlider').oninput=e=>setFrame(parseInt(e.target.value));

  document.getElementById('pbPause').onclick=pause;
  document.getElementById('pbBack').onclick=()=>setFrame(Math.max(0,playbackFrame-1));
  document.getElementById('pbFwd').onclick=()=>setFrame(Math.min(6,playbackFrame+1));
  document.getElementById('pbReset').onclick=()=>{pause();setFrame(6);};
  document.getElementById('pbSpeed').onchange=e=>{pbSpeed=parseFloat(e.target.value);if(isPlaying){pause();play();}};

  // map toolbar
  document.getElementById('mtZoomIn').onclick=()=>map.zoomIn();

  document.getElementById('mtDraw').onclick=()=>alert('标绘工具 (mock): 选择标绘类型');

  });
  document.querySelectorAll('[data-analysis]').forEach(b=>b.onclick=()=>{
    const m={assess:'态势综合评估',formation:'编队聚合分析',anomaly:'异常目标告警',conflict:'航线冲突检测'};
    alert(m[b.dataset.analysis]+' 分析中... (mock)\n当前可见目标 '+visibleTargets().length+' 个');
  });
  document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{
    const m={image:'态势图图片',kml:'KML',report:'研判报表',csv:'轨迹CSV'};
    alert('导出 '+m[b.dataset.export]+' (mock)');
  });

  // data source toggles
  document.querySelectorAll('[data-ds]').forEach(c=>{
    c.onchange=()=>{
      const ds=c.dataset.ds, vis=c.checked;
      if(ds==='ais'){ targets.filter(t=>t.cat==='海').forEach(t=>{if(markers[t.id])markers[t.id].setVisible(vis);if(trajLines[t.id])trajLines[t.id].setVisible(vis);}); }
      else if(ds==='adsb'){ targets.filter(t=>t.cat==='空').forEach(t=>{if(markers[t.id])markers[t.id].setVisible(vis);if(trajLines[t.id])trajLines[t.id].setVisible(vis);}); }
      else if(ds==='intel'){ targets.filter(t=>t.cat==='人员').forEach(t=>{if(markers[t.id])markers[t.id].setVisible(vis);}); }
      else if(ds==='basemap'){ if(vis){islandPolygon.show();alertCircle.show();baselineLine.show();}else{islandPolygon.hide();alertCircle.hide();baselineLine.hide();} }
    };
  });

  // layer switch
  document.querySelectorAll('[data-layer]').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('[data-layer]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const l=b.dataset.layer;
      if(l==='sat'){satelliteLayer.show();roadLayer.show();}
      else if(l==='chart'){satelliteLayer.hide();roadLayer.hide();}
      else if(l==='vector'){satelliteLayer.hide();roadLayer.show();}
    };
  });

  // time range
  document.getElementById('timeRange').onchange=e=>{
    if(e.target.value==='custom') alert('自定义时段 (mock)');
  };

  // auto refresh status bar
  setInterval(updateStatusBar,30000);
});
